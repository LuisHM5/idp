# MANTENIMIENTO: este archivo es el contrato formal del API REST, derivado de
# `documentacion/API_USO.md` (la referencia narrativa con ejemplos curl). Si
# agregas, quitas o cambias un endpoint (ruta, método, params, body o
# respuesta) en `src/document-validation-stack.ts` o en los handlers de
# `upload-lambda`/`query-lambda`, actualiza AMBOS archivos en el mismo cambio.
# Ver AGENTS.md → "API Documentation".
#
# Ver localmente con Scalar (por default) o Swagger UI: `pnpm docs:api`.
openapi: 3.1.0
info:
  title: Documents Validator API
  version: "1.0.0"
  license:
    name: ISC
  description: |
    API REST para procesar documentos (pedimentos aduanales, facturas,
    expedientes multi-documento...) con el pipeline de clasificación →
    extracción → validación (Amazon Bedrock + reglas del catálogo), y consultar
    sus resultados.

    ## El ciclo completo

    **Subir un documento son DOS peticiones**, y la segunda no va a esta API
    sino a S3. Es el único punto del contrato que no se ve entero en este
    documento, así que va explícito.

    **Los cuatro pasos están documentados como operaciones**, en orden, y cada
    uno trae su ejemplo en **curl, Node.js, Python y C#** — usa el selector de
    lenguaje de esa operación. Los ejemplos encadenan: el paso 1 deja las
    variables que usan el 2, el 3 y el 4.

    | # | Operación | Auth | Cuerpo | Respuesta |
    |---|---|---|---|---|
    | 1 | `POST /documents` | `x-api-key` | JSON o form con la metadata | `200` · `documentId`, `uploadUrl`, `uploadExpiresAt` |
    | 2 | `PUT {uploadUrl}` **(a S3)** | **ninguna** — firmada en la URL | los bytes crudos del archivo | `200` con **cuerpo vacío**; S3 no devuelve JSON |
    | 3 | `GET /documents/{documentId}` | `x-api-key` | — | `200` con el resultado, o `404` mientras procesa |
    | 4 | `GET /documents/{documentId}/file` | `x-api-key` | — | `200` · URL prefirmada para bajar el original |

    Los pasos 1 y 2 **van siempre juntos**: subir un documento son dos
    peticiones. Sin el paso 2 el documento nunca llega a S3 y nunca se procesa.

    El paso 2 es el único que **no va a esta API** (su host es S3) y el único
    **sin `x-api-key`**. Se documenta igual, como operación, porque es una
    petición que tu integración tiene que hacer.

    El paso 4 es opcional: solo si necesitas recuperar el archivo original.

    Entre el paso 2 y el 3 corre el pipeline solo, sin que haya que avisarle a
    nada: `S3 → SQS → Step Functions → Textract/Bedrock → DynamoDB`. Por eso el
    paso 3 responde `404` mientras tanto — es "todavía no", no "no existe".

    ### Paso 2 — el `PUT` a S3 (no está en `paths`, va a otro host)

    `uploadUrl` es una URL prefirmada de S3: un `PUT` con el archivo en el
    cuerpo, **sin credenciales de AWS** y sin pasar por esta API. Por eso no
    aparece como operación aquí — el host es S3, no el API Gateway.

    ```bash
    # $RESP es la respuesta del paso 1
    curl -X PUT \
      -H "x-amz-meta-app-origin: CEDIS" \
      --upload-file pedimento.pdf \
      "$(echo "$RESP" | jq -r .uploadUrl)"
    ```

    - **Método:** `PUT` (viene en `uploadMethod`). No `POST`, no multipart, no
      form-data: el cuerpo son los bytes crudos del archivo.
    - **Cabeceras: ninguna.** No mandes nada extra. Al prefirmar, SigV4
      *hoistea* los `x-amz-*` al query string, así que la metadata del
      documento ya viaja dentro de la URL y está cubierta por la firma
      (`X-Amz-SignedHeaders=host`). Mandarla además como header hace que S3
      rechace el PUT con `403 AccessDenied: There were headers present in the
      request which were not signed`.
    - **Respuesta esperada:** `200` con cuerpo vacío. S3 no devuelve JSON.
    - **Vencimiento:** 15 min (`uploadExpiresAt` trae el instante exacto). Si
      expira, repite el paso 1 — las URLs no se renuevan.
    - **Tamaño:** hasta 5 GB. El archivo nunca toca API Gateway (tope 10 MB) ni
      Lambda (tope 6 MB), que son límites duros de AWS.
    - Sirve desde cualquier cliente HTTP: Java, .NET, Python, SAP, Postman, curl.

    ### Paso 3 — leer el resultado

    El pipeline tarda segundos, no milisegundos. Mientras corre,
    `GET /documents/{id}` responde `404`: es "todavía no", no "no existe".
    Consulta cada pocos segundos hasta que traiga `validation.status`.

    ---

    Este spec es el contrato formal de la API; la guía narrativa con ejemplos
    curl completos, notas de seguridad y el apéndice de "dónde queda el
    resultado" vive en `documentacion/API_USO.md`.
externalDocs:
  description: Guía de uso completa (español, con ejemplos curl)
  url: ../documentacion/API_USO.md
servers:
  - url: "{apiEndpoint}"
    description: >
      dev (default) — URL execute-api del stack `DocumentValidationStack-Dev`.
      Exige `x-api-key` si se desplegó con `DEV_API_KEY_REQUIRED=true`; sin esa
      variable queda abierta, pero igual acepta la key, así que mándala siempre.
      Sale del output `ApiEndpoint` del stack (ver documentacion/API_USO.md →
      "Base URL y autenticación").
    variables:
      apiEndpoint:
        default: https://REPLACE-ME.execute-api.us-east-1.amazonaws.com/prod
  - url: https://idp.alsuper.com
    description: prod — dominio propio; exige `x-api-key` en todos los endpoints.
# `x-api-key` es el default del contrato: prod siempre la exige y dev la exige
# en cuanto se despliega con DEV_API_KEY_REQUIRED=true. Se documenta como
# REQUERIDA a propósito — un dev abierto es una comodidad de pruebas, no el
# contrato: un integrador que se guíe por este spec debe mandar la key siempre,
# y así el mismo código funciona en los dos ambientes sin cambios.
security:
  - ApiKeyAuth: []
tags:
  - name: Subir un documento
    description: >
      Los dos pasos de una subida: `POST /documents` registra el documento y
      devuelve una URL prefirmada, y el `PUT` lleva el archivo a S3. El endpoint
      NO recibe el archivo en ningún momento.
  - name: Consultar documentos
    description: Resultados, archivo original y búsqueda por campo.
paths:
  /{uploadUrl}:
    put:
      operationId: putFileToPresignedUrl
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            # UPLOAD_URL viene del paso 1. NINGUNA cabecera extra: la firma y la metadata
            # ya viajan en el query string de la URL. Sin x-api-key: no pasa por el API.
            curl -sS --fail -X PUT --upload-file pedimento.pdf "$UPLOAD_URL"
            # 200 con cuerpo vacío = subido. El pipeline arranca solo.
        - lang: JavaScript
          label: Node.js 18+
          source: |
            import { readFile } from "node:fs/promises";

            // uploadUrl viene del paso 1. NINGUNA cabecera extra: la firma y la metadata
            // ya viajan en el query string de la URL. Sin x-api-key: no pasa por el API.
            const put = await fetch(uploadUrl, {
              method: "PUT",
              body: await readFile("pedimento.pdf"),
            });
            if (!put.ok) throw new Error(`PUT S3 → ${put.status}: ${await put.text()}`);
            // 200 con cuerpo vacío = subido. El pipeline arranca solo.
        - lang: Python
          label: Python 3 (requests)
          source: |
            # upload_url viene del paso 1. NINGUNA cabecera extra: la firma y la metadata
            # ya viajan en el query string de la URL. Sin x-api-key: no pasa por el API.
            with open("pedimento.pdf", "rb") as fh:
                put = requests.put(upload_url, data=fh, timeout=300)  # data=fh → streaming
            put.raise_for_status()
            # 200 con cuerpo vacío = subido. El pipeline arranca solo.
        - lang: C#
          label: .NET 6+
          source: |
            // uploadUrl viene del paso 1. Cliente SEPARADO: el del API lleva x-api-key en
            // DefaultRequestHeaders y esta petición no debe llevarla.
            // NINGUNA cabecera extra: la firma y la metadata ya viajan en la URL.
            using var s3 = new HttpClient();
            using var content = new StreamContent(File.OpenRead("pedimento.pdf"));

            var put = await s3.PutAsync(uploadUrl, content);
            put.EnsureSuccessStatusCode();
            // 200 con cuerpo vacío = subido. El pipeline arranca solo.
      tags: [Subir un documento]
      summary: "Paso 2 de 4: subir el archivo a la uploadUrl (host S3)"
      servers:
        - url: "https://{bucket}.s3.{region}.amazonaws.com"
          description: >
            **S3, no esta API.** La URL completa —incluida la firma— viene en
            `uploadUrl` del paso 1; no se arma a mano. Por eso "Try it" no
            funciona aquí: cada URL está firmada para un objeto y un momento
            concretos.
          variables:
            bucket:
              default: documentvalidationstack-dev-documentbucket
            region:
              default: us-east-1
      security: []
      description: >
        Sube los bytes del archivo a la URL prefirmada que devolvió el paso 1.
        En cuanto S3 recibe el objeto, el pipeline arranca solo
        (`S3 → SQS → Step Functions → Textract/Bedrock → DynamoDB`).


        Se documenta como operación aparte porque **es una petición que tu
        integración debe hacer**, aunque no vaya a este API sino a S3
        directamente. Sin ella el documento nunca se procesa.


        - **Sin autenticación.** La autorización va firmada en la URL. **No
        mandes `x-api-key`**: esta petición no pasa por API Gateway.

        - **No mandes ninguna cabecera extra.** Al prefirmar, SigV4 *hoistea*
        los `x-amz-*` al query string: la metadata del documento ya va dentro de
        la URL y firmada. Añadirla como header hace que S3 responda
        `403 AccessDenied: There were headers present in the request which were
        not signed`. Si necesitas fijar el `Content-Type` del objeto guardado,
        ése sí puedes mandarlo (no es `x-amz-*`, S3 no exige que esté firmado).

        - **El cuerpo son los bytes crudos.** No multipart, no form-data, no
        base64.

        - **Caduca a los 15 min** (`uploadExpiresAt`). Si expira, repite el paso
        1: las URLs no se renuevan.

        - Hasta **5 GB**. No pasa por API Gateway (tope 10 MB) ni Lambda (6 MB).
      requestBody:
        required: true
        description: Los bytes del archivo, sin envolver.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: >
            Subido. **El cuerpo viene vacío** — S3 no devuelve JSON. Un cliente
            que intente parsearlo falla sobre una respuesta que en realidad
            salió bien.
        "403":
          description: >
            `AccessDenied` o `SignatureDoesNotMatch`, en XML (no JSON). Las dos
            causas habituales: mandaste cabeceras `x-amz-*` de más —el mensaje
            las lista en `<HeadersNotSigned>`— o la URL ya expiró. Si expiró,
            repite el paso 1.
      parameters:
        - name: uploadUrl
          in: path
          required: true
          description: >
            No es un parámetro que armes: usa la `uploadUrl` completa del paso
            1, tal cual, con su query string de firma.
          schema: { type: string }

  /documents/{id}:
    get:
      operationId: getDocumentById
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            # DOC_ID viene del paso 1. 404 = todavía procesando, no "no existe".
            until curl -sS -f "$API/documents/$DOC_ID" -H "x-api-key: $KEY" -o result.json; do
              echo "aún procesando..."; sleep 5
            done

            jq '.validation.status' result.json
            jq '.expediente.documents[] | {documentType, pageStart, pageEnd, extractedEntities}' result.json
        - lang: JavaScript
          label: Node.js 18+
          source: |
            // documentId viene del paso 1. 404 = todavía procesando, no "no existe".
            let doc;
            for (let i = 0; i < 60; i++) {
              const r = await fetch(`${API}/documents/${documentId}`, {
                headers: { "x-api-key": KEY },
              });
              if (r.ok) { doc = await r.json(); break; }
              if (r.status !== 404) throw new Error(`GET → ${r.status}: ${await r.text()}`);
              await new Promise((s) => setTimeout(s, 5000));
            }

            console.log(doc.validation.status);            // APROBADO | REQUIERE_REVISION | RECHAZADO
            for (const d of doc.expediente.documents) {
              console.log(d.documentType, `págs ${d.pageStart}-${d.pageEnd}`);
              for (const [campo, v] of Object.entries(d.extractedEntities ?? {}))
                console.log("  ", campo, "=", v.value, `(conf ${v.confidence}, valid ${v.valid})`);
            }
        - lang: Python
          label: Python 3 (requests)
          source: |
            import time

            # document_id viene del paso 1. 404 = todavía procesando, no "no existe".
            doc = None
            for _ in range(60):
                r = requests.get(f"{API}/documents/{document_id}",
                                 headers={"x-api-key": KEY}, timeout=30)
                if r.ok:
                    doc = r.json()
                    break
                if r.status_code != 404:
                    r.raise_for_status()
                time.sleep(5)

            print(doc["validation"]["status"])   # APROBADO | REQUIERE_REVISION | RECHAZADO
            for d in doc["expediente"]["documents"]:
                print(d["documentType"], f"págs {d['pageStart']}-{d['pageEnd']}")
                for campo, v in (d.get("extractedEntities") or {}).items():
                    print("  ", campo, "=", v["value"], f"(conf {v['confidence']}, valid {v['valid']})")
        - lang: C#
          label: .NET 6+
          source: |
            using System.Net;

            // documentId viene del paso 1. 404 = todavía procesando, no "no existe".
            JsonElement doc = default;
            for (var i = 0; i < 60; i++)
            {
                var r = await http.GetAsync($"{api}/documents/{documentId}");
                if (r.IsSuccessStatusCode)
                {
                    doc = await r.Content.ReadFromJsonAsync<JsonElement>();
                    break;
                }
                if (r.StatusCode != HttpStatusCode.NotFound) r.EnsureSuccessStatusCode();
                await Task.Delay(5000);
            }

            // APROBADO | REQUIERE_REVISION | RECHAZADO
            Console.WriteLine(doc.GetProperty("validation").GetProperty("status"));
            foreach (var d in doc.GetProperty("expediente").GetProperty("documents").EnumerateArray())
            {
                var tipo  = d.GetProperty("documentType");
                var desde = d.GetProperty("pageStart");
                var hasta = d.GetProperty("pageEnd");
                Console.WriteLine($"{tipo} págs {desde}-{hasta}");
            }
      tags: [Consultar documentos]
      summary: "Paso 3 de 4: consultar el resultado del documento"
      description: >
        `{id}` puede ser el id completo o un prefijo (gana el primer match).
        `result` es el envelope completo, el mismo que se guarda en DynamoDB
        y se publica en EventBridge — ver `documentacion/API_USO.md` §2 para
        el shape anotado campo por campo.
      parameters:
        - $ref: "#/components/parameters/DocumentIdPath"
        - name: full
          in: query
          description: >
            `1`/`true` agrega `fullResult`: el detalle más profundo desde S3
            (fields[] con extractedValue/normalizedValue/confidence/status/checks).
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Resultado del documento.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResult" }
        "404":
          description: >
            `NOT_FOUND`. Tres causas, misma respuesta:


            1. **Todavía se está procesando** — la causa más común justo
            después de subir. El resultado se persiste al terminar el
            pipeline, así que hasta entonces el id no resuelve. Trátalo como
            "aún no", no como "no existe": haz *polling* cada pocos segundos.

            2. No hay documento con ese id/prefijo.

            3. Existe, pero la app que llama no tiene permiso de verlo — misma
            respuesta a propósito, para no confirmar que un documento fuera de
            tu alcance exista.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /documents/{id}/file:
    get:
      operationId: getDocumentFile
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            # Devuelve una URL prefirmada, NO los bytes. Dos peticiones:
            URL=$(curl -sS "$API/documents/$DOC_ID/file" -H "x-api-key: $KEY" | jq -r .downloadUrl)

            # La descarga va a S3: sin x-api-key.
            curl -sS -o pedimento-original.pdf "$URL"
        - lang: JavaScript
          label: Node.js 18+
          source: |
            import { writeFile } from "node:fs/promises";

            // Devuelve una URL prefirmada, NO los bytes.
            const meta = await (await fetch(`${API}/documents/${documentId}/file`, {
              headers: { "x-api-key": KEY },
            })).json();

            // La descarga va a S3: sin x-api-key.
            const bytes = Buffer.from(await (await fetch(meta.downloadUrl)).arrayBuffer());
            await writeFile("pedimento-original.pdf", bytes);
        - lang: Python
          label: Python 3 (requests)
          source: |
            # Devuelve una URL prefirmada, NO los bytes.
            meta = requests.get(f"{API}/documents/{document_id}/file",
                                headers={"x-api-key": KEY}, timeout=30).json()

            # La descarga va a S3: sin x-api-key, y en streaming por si pesa cientos de MB.
            with requests.get(meta["downloadUrl"], stream=True, timeout=300) as resp:
                resp.raise_for_status()
                with open("pedimento-original.pdf", "wb") as fh:
                    for chunk in resp.iter_content(1 << 20):
                        fh.write(chunk)
        - lang: C#
          label: .NET 6+
          source: |
            // Devuelve una URL prefirmada, NO los bytes.
            var meta = await http.GetFromJsonAsync<JsonElement>(
                $"{api}/documents/{documentId}/file");

            // La descarga va a S3: cliente sin x-api-key.
            using var s3 = new HttpClient();
            var url = meta.GetProperty("downloadUrl").GetString();
            await File.WriteAllBytesAsync("pedimento-original.pdf",
                await s3.GetByteArrayAsync(url));
      tags: [Consultar documentos]
      summary: "Paso 4 de 4: obtener el archivo original (URL de descarga)"
      description: >
        Devuelve una URL prefirmada (no los bytes) para el archivo tal cual
        se subió — PDF/imagen/XML/XLSX/CSV original, no el resultado de la
        extracción. Sin tope de tamaño real: el cliente descarga directo de
        S3, sin pasar por Lambda ni API Gateway.
      parameters:
        - $ref: "#/components/parameters/DocumentIdPath"
        - name: expiresIn
          in: query
          description: Segundos de validez de la URL. Fuera de [60, 3600] se recorta, no da error.
          schema: { type: integer, default: 900, minimum: 60, maximum: 3600 }
      responses:
        "200":
          description: URL prefirmada emitida.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileDownloadResponse" }
        "404":
          description: >
            `NOT_FOUND` (documento inexistente o sin permiso, igual que
            `GET /documents/{id}`) o `FILE_NOT_FOUND` (el documento existe y
            es visible, pero el objeto original no está en `processed/`/`failed/`
            todavía — p. ej. sigue en PROCESSING).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /documents:
    post:
      operationId: createDocument
      tags: [Subir un documento]
      summary: "Paso 1 de 4: registrar el documento y obtener la URL de subida"
      description: >
        **Este endpoint no recibe el archivo.** Registra el documento, acuña su
        `documentId` y devuelve una URL prefirmada de S3 para subirlo. El
        pipeline arranca en el paso 2, cuando S3 recibe los bytes.


        **Son dos pasos, siempre, sin importar el tamaño del archivo:**


        1. `POST /documents` con solo metadata → devuelve `uploadUrl`.

        2. `PUT {uploadUrl}` con el archivo → va directo a S3, y el pipeline
        arranca en cuanto S3 recibe el objeto.


        El archivo nunca pasa por API Gateway ni por el Lambda: API Gateway topa
        un request en 10MB y Lambda una invocación síncrona en 6MB (límites duros
        de AWS, no configurables), mientras que un `PUT` a S3 acepta hasta 5GB.
        Así no hay rama por tamaño que se pueda equivocar.


        **Migración:** el modo inline (`contentBase64` en el body) fue eliminado.
        Un request que lo mande recibe `400 INLINE_UPLOAD_REMOVED` con el flujo
        nuevo, en vez de fallar en silencio.


        El body puede ir como `application/json` o como
        `application/x-www-form-urlencoded`; ambos aceptan los mismos campos.
        Como todo valor de un formulario es texto, ahí `metadata` va como un
        objeto JSON codificado en string (`metadata={"lote":"A123"}`); si no es
        JSON válido, la respuesta es `400 INVALID_METADATA`.


        **El `PUT` del paso 2 no lleva ninguna cabecera extra.** La firma y la
        metadata del documento viajan en el query string de `uploadUrl`; añadir
        cabeceras `x-amz-*` hace que S3 rechace la subida.

      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            API="https://xxxx.execute-api.us-east-1.amazonaws.com/prod"
            KEY="tu-api-key"

            RESP=$(curl -sS -X POST "$API/documents" \
              -H "Content-Type: application/json" \
              -H "x-api-key: $KEY" \
              -d '{"fileName":"pedimento.pdf","documentType":"PEDIMENTO_ADUANAL"}')

            # Guarda los dos: el uploadUrl para el paso 2, el documentId para el 3.
            DOC_ID=$(echo "$RESP"     | jq -r .documentId)
            UPLOAD_URL=$(echo "$RESP" | jq -r .uploadUrl)
        - lang: JavaScript
          label: Node.js 18+
          source: |
            const API = "https://xxxx.execute-api.us-east-1.amazonaws.com/prod";
            const KEY = "tu-api-key";

            const res = await fetch(`${API}/documents`, {
              method: "POST",
              headers: { "Content-Type": "application/json", "x-api-key": KEY },
              body: JSON.stringify({
                fileName: "pedimento.pdf",
                documentType: "PEDIMENTO_ADUANAL",
              }),
            });
            if (!res.ok) throw new Error(`POST /documents → ${res.status}: ${await res.text()}`);

            // Guarda los dos: uploadUrl para el paso 2, documentId para el 3.
            const { documentId, uploadUrl } = await res.json();
        - lang: Python
          label: Python 3 (requests)
          source: |
            import requests

            API = "https://xxxx.execute-api.us-east-1.amazonaws.com/prod"
            KEY = "tu-api-key"

            res = requests.post(
                f"{API}/documents",
                headers={"x-api-key": KEY},
                json={"fileName": "pedimento.pdf", "documentType": "PEDIMENTO_ADUANAL"},
                timeout=30,
            )
            res.raise_for_status()

            # Guarda los dos: uploadUrl para el paso 2, documentId para el 3.
            up = res.json()
            document_id = up["documentId"]
            upload_url = up["uploadUrl"]
        - lang: C#
          label: .NET 6+
          source: |
            using System.Net.Http.Json;
            using System.Text.Json;

            const string api = "https://xxxx.execute-api.us-east-1.amazonaws.com/prod";
            const string key = "tu-api-key";

            // Cliente del API: siempre con x-api-key.
            using var http = new HttpClient();
            http.DefaultRequestHeaders.Add("x-api-key", key);

            var res = await http.PostAsJsonAsync($"{api}/documents", new
            {
                fileName = "pedimento.pdf",
                documentType = "PEDIMENTO_ADUANAL",
            });
            res.EnsureSuccessStatusCode();

            // Guarda los dos: uploadUrl para el paso 2, documentId para el 3.
            var up = await res.Content.ReadFromJsonAsync<JsonElement>();
            var documentId = up.GetProperty("documentId").GetString()!;
            var uploadUrl  = up.GetProperty("uploadUrl").GetString()!;
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
            examples:
              pedimento:
                summary: Pedimento con tipo declarado
                value:
                  fileName: pedimento.pdf
                  documentType: PEDIMENTO_ADUANAL
                  metadata: { lote: "A123" }
              autoClassify:
                summary: Sin tipo — Bedrock clasifica y segmenta solo
                value:
                  fileName: expediente.pdf
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/UploadRequest"
            examples:
              presigned:
                summary: Prefirmado desde un cliente que solo manda formularios
                value:
                  fileName: expediente.pdf
                  documentType: PEDIMENTO_ADUANAL
      responses:
        "200":
          description: >
            Solicitud aceptada y URL de subida emitida. El documento todavía NO
            existe: el pipeline arranca hasta que el `PUT` del paso 2 deposite
            el archivo en S3.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
              examples:
                pedimento:
                  value:
                    documentId: e18d014a-...
                    bucket: documentvalidationstack-...
                    key: raw/PEDIMENTO_ADUANAL/e18d014a-.../pedimento.pdf
                    documentType: PEDIMENTO_ADUANAL
                    classificationMode: manual
                    uploadUrl: "https://...s3.amazonaws.com/..."
                    uploadMethod: PUT
                    uploadExpiresInSeconds: 900
                    uploadExpiresAt: "2026-07-27T13:33:19.000Z"
                    uploadedAt: "2026-07-27T13:18:19.000Z"
        "400":
          description: >
            Body inválido. Códigos posibles:


            - `MISSING_FIELD` — falta `fileName`.

            - `INVALID_FORMAT` — extensión fuera de
            pdf/jpg/jpeg/png/xml/xlsx/csv.

            - `DOCUMENT_TYPE_REQUIRED` — el archivo es `.xml`/`.xlsx`/`.csv` y
            falta `documentType` (esos formatos no tienen clasificación
            automática por visión).

            - `INVALID_DOCUMENT_TYPE` — `documentType` no es UPPER_SNAKE_CASE.

            - `INVALID_JSON` — el body no es JSON válido.

            - `INVALID_METADATA` — body de formulario cuyo `metadata` no es un
            objeto JSON válido codificado en string.

            - `INLINE_UPLOAD_REMOVED` — el body trae `contentBase64`. El modo
            inline se eliminó; usa el flujo de dos pasos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: >
            `PRESIGN_FAILED` — no se pudo firmar la URL de subida. Es
            reintentable: no se creó ningún objeto ni se consumió el
            `documentId`, así que basta con repetir el `POST`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    get:
      operationId: searchDocuments
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            # --- Camino rápido: campo declarado `unique_key` (una sola Query).
            #     Da igual con espacios o sin ellos: la normalización es la misma al
            #     escribir y al buscar (`digits` en este tipo).
            curl -sS -H "x-api-key: $KEY" \
              "$API/documents?docType=PEDIMENTO_ADUANAL&field=NUMERO_PEDIMENTO&value=26%2007%200823%206001630" \
              | jq '{lookup, count, ids: [.matches[].documentId]}'

            # --- Cualquier otro campo: basta el NOMBRE, no el dot-path completo.
            #     Si el path no resuelve en la raíz, busca en profundidad por esa clave.
            curl -sS -H "x-api-key: $KEY" \
              "$API/documents?docType=PEDIMENTO_ADUANAL&field=RFC_IMPORTADOR_EXPORTADOR&value=OFU910626UQ0&summary=1" \
              | jq '.matches[] | {documentId, matchedValue, matchedAt}'

            # --- Subcadena, y acotando por fecha y estado.
            curl -sS -H "x-api-key: $KEY" \
              "$API/documents?docType=PEDIMENTO_ADUANAL&field=AGENTE_ADUANAL_NOMBRE&value=GAVANTI&op=contains&status=APROBADO&since=2026-07-01&limit=50"
        - lang: JavaScript
          label: Node.js 18+
          source: |
            // Manda SIEMPRE docType: acota la búsqueda dentro de DynamoDB. Sin él, la
            // consulta cae a un Scan de toda la tabla.
            async function buscar(params) {
              const qs = new URLSearchParams(params);          // encodea espacios y acentos
              const r = await fetch(`${API}/documents?${qs}`, {
                headers: { "x-api-key": KEY },
              });
              if (!r.ok) throw new Error(`GET /documents → ${r.status}: ${await r.text()}`);
              return r.json();
            }

            // Camino rápido: campo declarado `unique_key` → una sola Query.
            // El valor se normaliza igual al escribir y al buscar, así que da lo mismo
            // mandarlo con espacios ("26 07 0823 6001630") o sin ellos.
            const porNumero = await buscar({
              docType: "PEDIMENTO_ADUANAL",
              field: "NUMERO_PEDIMENTO",
              value: "26 07 0823 6001630",
            });
            console.log(porNumero.lookup, porNumero.count);   // "uniqueKey" 1

            // Cualquier otro campo: basta el NOMBRE, no el dot-path completo.
            const porRfc = await buscar({
              docType: "PEDIMENTO_ADUANAL",
              field: "RFC_IMPORTADOR_EXPORTADOR",
              value: "OFU910626UQ0",
              summary: "1",
            });
            for (const m of porRfc.matches)
              console.log(m.documentId, m.matchedValue, "←", m.matchedAt);
        - lang: Python
          label: Python 3 (requests)
          source: |
            # Manda SIEMPRE docType: acota la búsqueda dentro de DynamoDB. Sin él, la
            # consulta cae a un Scan de toda la tabla.
            def buscar(**params):
                r = requests.get(f"{API}/documents", params=params,   # requests encodea solo
                                 headers={"x-api-key": KEY}, timeout=30)
                r.raise_for_status()
                return r.json()

            # Camino rápido: campo declarado `unique_key` → una sola Query.
            # El valor se normaliza igual al escribir y al buscar, así que da lo mismo
            # mandarlo con espacios ("26 07 0823 6001630") o sin ellos.
            por_numero = buscar(docType="PEDIMENTO_ADUANAL",
                                field="NUMERO_PEDIMENTO",
                                value="26 07 0823 6001630")
            print(por_numero["lookup"], por_numero["count"])   # "uniqueKey" 1

            # Cualquier otro campo: basta el NOMBRE, no el dot-path completo.
            por_rfc = buscar(docType="PEDIMENTO_ADUANAL",
                             field="RFC_IMPORTADOR_EXPORTADOR",
                             value="OFU910626UQ0",
                             summary="1")
            for m in por_rfc["matches"]:
                print(m["documentId"], m["matchedValue"], "←", m["matchedAt"])
        - lang: C#
          label: .NET 6+
          source: |
            using System.Web;

            // Manda SIEMPRE docType: acota la búsqueda dentro de DynamoDB. Sin él, la
            // consulta cae a un Scan de toda la tabla.
            async Task<JsonElement> BuscarAsync(params (string k, string v)[] parametros)
            {
                var qs = HttpUtility.ParseQueryString(string.Empty);
                foreach (var (k, v) in parametros) qs[k] = v;
                return await http.GetFromJsonAsync<JsonElement>($"{api}/documents?{qs}");
            }

            // Camino rápido: campo declarado `unique_key` → una sola Query.
            // El valor se normaliza igual al escribir y al buscar, así que da lo mismo
            // mandarlo con espacios ("26 07 0823 6001630") o sin ellos.
            var porNumero = await BuscarAsync(
                ("docType", "PEDIMENTO_ADUANAL"),
                ("field", "NUMERO_PEDIMENTO"),
                ("value", "26 07 0823 6001630"));
            Console.WriteLine($"{porNumero.GetProperty("lookup")} {porNumero.GetProperty("count")}");

            // Cualquier otro campo: basta el NOMBRE, no el dot-path completo.
            var porRfc = await BuscarAsync(
                ("docType", "PEDIMENTO_ADUANAL"),
                ("field", "RFC_IMPORTADOR_EXPORTADOR"),
                ("value", "OFU910626UQ0"),
                ("summary", "1"));
            foreach (var m in porRfc.GetProperty("matches").EnumerateArray())
            {
                var id    = m.GetProperty("documentId");
                var valor = m.GetProperty("matchedValue");
                var donde = m.GetProperty("matchedAt");
                Console.WriteLine($"{id} {valor} <- {donde}");
            }
      tags: [Consultar documentos]
      summary: Buscar/listar documentos por tipo y/o por cualquier campo extraído
      description: >
        Requiere al menos uno de `docType` o `field`+`value`. Con ambos,
        `docType` acota primero en DynamoDB (Query al GSI `DocumentTypeIndex`,
        sin Scan) y el filtro por campo solo se aplica a esos documentos.


        **No necesitas el dot-path completo: basta el NOMBRE del campo.** Si el
        path no resuelve en la raíz del envelope, se hace una búsqueda profunda
        por su última clave, así que `field=NUMERO_PEDIMENTO` lo encuentra esté
        donde esté anidado. `matchedAt` en cada match dice dónde coincidió: el
        path exacto, o `*.CLAVE` si fue por búsqueda profunda.


        La comparación es sobre texto, sin distinguir mayúsculas y recortando
        espacios. `op=contains` busca subcadena; el default `eq` exige igualdad.


        **Tres caminos de acceso; `lookup` en la respuesta dice cuál contestó:**


        | `lookup` | Cuándo | Costo |
        | --- | --- | --- |
        | `uniqueKey` | El campo está declarado `unique_key` en el catálogo del tipo, con `docType` y `op=eq` | **Una** Query, sin importar cuántos documentos existan |
        | `typeIndex` | Hay `docType`, pero el campo no es unique key | Query al GSI del tipo + filtrado en la Lambda |
        | `scan` | **No mandaste `docType`** | Scan de toda la tabla — evítalo |


        Hoy `PEDIMENTO_ADUANAL` declara `unique_key` en `NUMERO_PEDIMENTO` y
        `NUMERO_PEDIMENTO_NORMALIZADO`, ambos normalizados a solo dígitos: la
        misma normalización se aplica al escribir y al buscar, así que
        `26 07 0823 6001630` y `260708236001630` encuentran lo mismo.


        Si no se cumplen las condiciones del camino rápido, la búsqueda **cae al
        camino normal y encuentra el documento igual** — más lenta, nunca
        equivocada. Ver `catalogs/README.md` → "Unique keys".


        **Permiso aparte:** usar `field`/`value` requiere que la app tenga
        `AllowFieldSearch` (default **false**, por ser la ruta más cara). Sin él
        la respuesta es `403`, aunque el `docType` sí esté permitido.
      parameters:
        - name: docType
          in: query
          description: >
            TYPE_ID (`PEDIMENTO_ADUANAL`) o nombre/alias normalizado. Varios
            tipos separados por coma. Alias del param: `documentType`, `tipo`.
          schema: { type: string }
        - name: field
          in: query
          description: >
            Dot-path del campo extraído, p. ej.
            `extractedEntities.NUMERO_PEDIMENTO_NORMALIZADO`. Si no resuelve
            en la raíz, hace búsqueda profunda por la última clave del path.
            Cuando es la `unique_key` declarada por el tipo (con `docType` y
            `op=eq`) se resuelve por la tabla de lookup en una sola Query.
          schema: { type: string }
        - name: value
          in: query
          description: >
            Valor a comparar (case-insensitive, recorta espacios). Requiere
            `field`. En el camino de unique key se normaliza igual que al
            indexar, así que `26 07 0823 6001630` y `260708236001630`
            resuelven a la misma clave.
          schema: { type: string }
        - name: op
          in: query
          schema: { type: string, enum: [eq, contains], default: eq }
        - name: status
          in: query
          description: Solo se aplica en DynamoDB junto con `docType`.
          schema: { type: string, enum: [APROBADO, RECHAZADO, REQUIERE_REVISION] }
        - name: since
          in: query
          description: "ISO-8601, p. ej. 2026-07-01. Solo con `docType`."
          schema: { type: string, format: date }
        - name: until
          in: query
          schema: { type: string, format: date }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: expand
          in: query
          description: "`0`/`false` desactiva la búsqueda dentro de expedientes multi-documento."
          schema: { type: boolean, default: true }
        - name: limit
          in: query
          schema: { type: integer, default: 25, maximum: 100 }
        - name: summary
          in: query
          description: "`1`/`true` devuelve solo un resumen ligero por match en vez del envelope completo."
          schema: { type: boolean, default: false }
        - name: full
          in: query
          description: "`1`/`true` agrega `fullResult` por match (detalle por-campo desde S3, un GET de S3 por match)."
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Resultados de la búsqueda.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentSearchResponse" }
        "400":
          description: "`MISSING_PARAMS` — falta `docType` y también `field`+`value`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: >
            `FORBIDDEN` — se pidió un `docType` fuera de `AllowedDocTypes` de
            la app, o se usó `field`/`value` sin `AllowFieldSearch`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: >
        Mándala **siempre**: es el contrato por default.


        Sin key válida, API Gateway responde `403` de forma nativa, sin
        invocar la Lambda (no hay costo de backend).


        **prod** la exige siempre. **dev** la exige cuando se desplegó con
        `DEV_API_KEY_REQUIRED=true` (`devApiKeyRequired` en
        `src/document-validation-stack.ts`); un dev sin esa variable queda
        abierto y **también acepta requests con key**, así que mandarla
        siempre funciona en ambos ambientes sin condicionales en tu cliente.


        Además de autenticar, la key decide **qué documentos** puede leer cada
        app (por default, solo los que ella subió) — ver `AllowedDocTypes` /
        `AccessScope` en `documentacion/AMBIENTES_Y_SEGURIDAD.md`. Sin key, esa
        restricción por app no aplica.


        **No la mandes en el `PUT` a S3** del paso 2: ese va firmado en la URL
        y no pasa por API Gateway.
  parameters:
    DocumentIdPath:
      name: id
      in: path
      required: true
      description: Id completo del documento o un prefijo (gana el primer match).
      schema: { type: string }
  schemas:
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: >
            Código de error estable — programa contra este valor, no contra
            `message`. Upload: MISSING_FIELD, INVALID_FORMAT,
            DOCUMENT_TYPE_REQUIRED, INVALID_DOCUMENT_TYPE, INVALID_JSON,
            INVALID_METADATA, INLINE_UPLOAD_REMOVED, PRESIGN_FAILED.
            Consulta: NOT_FOUND, MISSING_PARAMS, FORBIDDEN.
        message: { type: string }
    UploadRequest:
      type: object
      required: [fileName]
      properties:
        fileName:
          type: string
          description: "Extensión soportada: pdf|jpg|jpeg|png|xml|xlsx|csv."
        contentBase64:
          deprecated: true
          type: string
          description: >
            ELIMINADO. El modo inline ya no existe; mandarlo devuelve
            `400 INLINE_UPLOAD_REMOVED`. Se documenta solo para que un cliente
            viejo encuentre aquí por qué dejó de funcionar. Usa el flujo de dos
            pasos (uploadUrl + PUT), que sirve para cualquier tamaño.
        documentType:
          type: string
          description: >
            TYPE_ID del catálogo. Opcional para PDF/imagen (Bedrock clasifica
            si se omite; si se manda, se honra sin re-clasificar/segmentar).
            Obligatorio para `.xml`/`.xlsx`/`.csv` (400 DOCUMENT_TYPE_REQUIRED
            si falta) — esos formatos se extraen determinísticamente, sin Bedrock.
        modelId:
          type: string
          description: >
            Solo dev — procesa este documento con el modelo de Bedrock indicado,
            sin redeploy. El stack de prod lo ignora a propósito.
        metadata:
          type: object
          description: >
            Metadata arbitraria que se conserva con el documento. En un body
            `x-www-form-urlencoded` va como objeto JSON en string
            (`metadata={"lote":"A123"}`); si no es JSON válido → 400
            INVALID_METADATA.
          additionalProperties: true
    UploadResponse:
      type: object
      description: >
        Los campos `upload*` son el contrato del paso 2: con ellos el cliente
        hace el `PUT` del archivo a S3.
      properties:
        documentId: { type: string }
        bucket: { type: string }
        key: { type: string }
        documentType: { type: string }
        classificationMode: { type: string, enum: [manual, automatic] }
        uploadedAt: { type: string, format: date-time }
        uploadUrl: { type: string, format: uri }
        uploadMethod: { type: string, enum: [PUT] }
        uploadExpiresInSeconds: { type: integer }
        uploadExpiresAt:
          type: string
          format: date-time
          description: Momento exacto en que la URL deja de servir.
    Tracking:
      type: object
      description: >
        Resumen de procedencia/procesamiento, presente en todo resultado
        (flujo estándar y expediente por igual). `createdAt` siempre está;
        `modelIds`/`appOrigin`/`modelFallbacks` solo si hay algo que reportar.
      properties:
        createdAt: { type: string, format: date-time }
        modelIds:
          type: object
          description: Modelo que realmente corrió por fase (extractor/recovery/...).
          additionalProperties: { type: string }
        appOrigin:
          type: string
          description: App que subió el documento (x-api-key registrada con `pnpm apps:register`).
        modelFallbacks:
          type: object
          description: Solo las fases donde hubo cambio automático de modelo.
          additionalProperties:
            type: object
            properties:
              expectedModel: { type: string }
              actualModel: { type: string }
              retries: { type: integer }
              attempts:
                type: array
                items:
                  type: object
                  properties:
                    model: { type: string }
                    error: { type: string }
    DocumentResult:
      type: object
      properties:
        documentId: { type: string }
        workflowStatus:
          type: string
          description: Estado del pipeline en DynamoDB (p. ej. complete).
        result:
          type: object
          description: >
            Envelope completo. `extractedEntities`/`expediente` varían según
            el catálogo del tipo de documento — ver
            documentacion/API_USO.md §2 para un ejemplo anotado completo.
          properties:
            documentId: { type: string }
            documentClassification: { type: string }
            tracking: { $ref: "#/components/schemas/Tracking" }
            extractedEntities:
              type: object
              description: Escalares del documento principal.
              additionalProperties: true
            validation:
              type: object
              properties:
                status: { type: string, enum: [APROBADO, RECHAZADO, REQUIERE_REVISION] }
                summary: { type: string }
            expediente:
              type: object
              description: >
                Presente solo para el flujo de expedientes/pedimentos
                multi-documento (pipeline: "expediente"). Incluye
                status/sourceFormat/pages/documents[]/crossDocumentChecks/tracking.
              additionalProperties: true
            fullResult:
              type: object
              description: Solo con `?full=1` — detalle por-campo (fields[]) desde S3.
              additionalProperties: true
            resultLocation:
              type: object
              properties:
                bucket: { type: string }
                key: { type: string }
    FileDownloadResponse:
      type: object
      properties:
        documentId: { type: string }
        fileName: { type: string }
        fileSizeBytes: { type: integer }
        location: { type: string, enum: [processed, failed] }
        downloadUrl: { type: string, format: uri }
        downloadMethod: { type: string, enum: [GET] }
        expiresInSeconds: { type: integer }
        expiresAt: { type: string, format: date-time }
    DocumentSearchResponse:
      type: object
      properties:
        docTypes: { type: array, items: { type: string } }
        resolvedTypes:
          type: array
          items:
            type: object
            properties:
              typeId: { type: string }
              input: { type: string }
              resolvedBy: { type: string }
        expandedContainers: { type: boolean }
        field: { type: string }
        value: { type: string }
        op: { type: string }
        order: { type: string }
        summary: { type: boolean }
        full: { type: boolean }
        indexed:
          type: boolean
          description: "true = Query indexada; false = Scan de la tabla."
        lookup:
          type: string
          enum: [uniqueKey, typeIndex, scan]
          description: >-
            Qué camino de acceso contestó. `uniqueKey`: una sola Query sobre
            `TIPODOC#<valor normalizado>` en la tabla de lookup, porque el
            tipo declara ese campo como `unique_key` en el catálogo (requiere
            docType y op=eq; costo independiente del número de documentos del
            tipo). `typeIndex`: Query al GSI DocumentTypeIndex + filtro por
            campo dentro de la Lambda. `scan`: sin docType, Scan de la tabla.
            Un valor aún no indexado cae a `typeIndex`/`scan` y se encuentra
            igual — el camino rápido nunca produce un falso negativo.
        restrictedToApp:
          type: string
          description: Solo si la app que llama tiene AccessScope=own.
        restrictedToDocTypes:
          type: array
          items: { type: string }
          description: Solo si la app tiene AllowedDocTypes configurado.
        count: { type: integer }
        scanned: { type: integer, description: Cuántos documentos se revisaron. }
        matches:
          type: array
          items:
            type: object
            description: Envelope completo por match (o resumen si summary=1), + matchedValue/matchedAt.
            additionalProperties: true
