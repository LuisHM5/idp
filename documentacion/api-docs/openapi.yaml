# MANTENIMIENTO: este archivo es el contrato formal del API REST; `API_USO.md`
# (mismo directorio) es la referencia narrativa con los ejemplos curl/Node/
# Python/C# completos por paso. Si agregas, quitas o cambias un endpoint
# (ruta, método, params, body o respuesta) en `src/document-validation-stack.ts`
# o en los handlers de `upload-lambda`/`query-lambda`/`enrichment-lambda/
# references_api.py` (rutas `/references`), actualiza AMBOS archivos
# en el mismo cambio. Ver AGENTS.md → "API Documentation".
#
# NO agregues `x-codeSamples` por operación: vivieron aquí hasta que una
# auditoría encontró ~525 líneas duplicadas byte a byte contra `API_USO.md`
# (2026-09-07) — los ejemplos completos son responsabilidad exclusiva de
# `API_USO.md`; este spec solo linkea a él (`externalDocs` y en cada
# `description` relevante).
#
# Ver localmente con Scalar (por default) o Swagger UI: `pnpm docs:api`.
openapi: 3.1.0
info:
  title: Documents Validator API
  version: "1.2.0"
  license:
    name: ISC
    identifier: ISC
  description: |
    API REST para procesar documentos (pedimentos aduanales, facturas,
    expedientes multi-documento...) con el pipeline de clasificación →
    extracción → validación (Amazon Bedrock + reglas del catálogo), y consultar
    sus resultados.

    ## El ciclo completo

    **Subir un documento son DOS peticiones**, y la segunda no va a esta API
    sino a S3. Es el único punto del contrato que no se ve entero en este
    documento, así que va explícito.

    **Los cuatro pasos están documentados como operaciones**, en orden. Este
    spec es el contrato tipado (paths, params, schemas); los ejemplos
    completos en **curl, Node.js, Python y C#** para cada paso — que
    encadenan, el paso 1 deja las variables que usan el 2, el 3 y el 4 — viven
    en [`API_USO.md`](./API_USO.md), un click aparte.

    | # | Operación | Auth | Cuerpo | Respuesta |
    |---|---|---|---|---|
    | 1 | `POST /documents` | `x-api-key` | JSON o form con la metadata | `200` · `documentId`, `uploadUrl`, `uploadExpiresAt` |
    | 2 | `PUT {uploadUrl}` **(a S3)** | **ninguna** — firmada en la URL | los bytes crudos del archivo | `200` con **cuerpo vacío**; S3 no devuelve JSON |
    | 3 | `GET /documents/{documentId}` | `x-api-key` | — | `202` mientras procesa; `200` al terminar |
    | 4 | `GET /documents/{documentId}/file` | `x-api-key` | — | `200` · URL prefirmada para bajar el original |

    Los pasos 1 y 2 **van siempre juntos**: subir un documento son dos
    peticiones. Sin el paso 2 el documento nunca llega a S3 y nunca se procesa.

    El paso 2 es el único que **no va a esta API** (su host es S3) y el único
    **sin `x-api-key`**. Se documenta igual, como operación, porque es una
    petición que tu integración tiene que hacer.

    El paso 4 es opcional: solo si necesitas recuperar el archivo original.

    Entre el paso 2 y el 3 corre el pipeline solo, sin que haya que avisarle a
    nada: `S3 → SQS → Step Functions → Textract/Bedrock → DynamoDB`. El paso 3
    responde `202` con `Retry-After` mientras trabaja; `404` sí significa que
    el id no existe o no es visible para la app que consulta.

    ### Paso 2 — el `PUT` a S3 (documentado como operación, pero va a otro host)

    `uploadUrl` es una URL prefirmada de S3: un `PUT` con el archivo en el
    cuerpo, **sin credenciales de AWS** y sin pasar por esta API. Se
    documenta como operación (`PUT /{uploadUrl}` abajo) para que aparezca en
    el flujo de 4 pasos, pero con `servers` propio apuntando a S3 y
    `security: []` — el "Try it" del visor no funciona ahí porque cada URL es
    de un solo uso y ya viene firmada, no se arma a mano.

    ```bash
    # $RESP es la respuesta del paso 1
    curl -X PUT \
      --upload-file pedimento.pdf \
      "$(echo "$RESP" | jq -r .uploadUrl)"
    ```

    - **Método:** `PUT` (viene en `uploadMethod`). No `POST`, no multipart, no
      form-data: el cuerpo son los bytes crudos del archivo.
    - **Cabeceras: ninguna.** No mandes nada extra. Al prefirmar, SigV4
      *hoistea* los `x-amz-*` al query string, así que la metadata del
      documento ya viaja dentro de la URL y está cubierta por la firma
      (`X-Amz-SignedHeaders=host`). Mandarla además como header hace que S3
      rechace el PUT con `403 AccessDenied: There were headers present in the
      request which were not signed`.
    - **Respuesta esperada:** `200` con cuerpo vacío. S3 no devuelve JSON.
    - **Vencimiento:** 15 min (`uploadExpiresAt` trae el instante exacto). Si
      expira, repite el paso 1 — las URLs no se renuevan.
    - **Tamaño:** hasta 5 GB. El archivo nunca toca API Gateway (tope 10 MB) ni
      Lambda (tope 6 MB), que son límites duros de AWS.
    - Sirve desde cualquier cliente HTTP: Java, .NET, Python, SAP, Postman, curl.

    ### Paso 3 — leer el resultado

    El pipeline tarda segundos, no milisegundos. Mientras corre,
    `GET /documents/{id}` responde `202` con `processingStatus` y
    `Retry-After`. Respeta ese encabezado y aumenta gradualmente la espera
    (con jitter, máximo recomendado 30 s) hasta recibir un estado terminal.

    ## Errores: qué significan de verdad

    Los mensajes de API Gateway engañan. Esta tabla es la que resuelve el 90 %
    de los tropiezos de una integración nueva:

    | Respuesta | Qué significa REALMENTE | Arreglo |
    | --- | --- | --- |
    | `{"message":"Missing Authentication Token"}` | **No existe ninguna ruta con ese método + ese path.** Pese al nombre, **nunca** es un problema de API key | Revisa la URL: ¿pusiste `/prod` con el dominio propio? ¿el método es el correcto? ¿hay un typo en `/documents`? |
    | `{"message":"Forbidden"}` | La ruta existe, pero falta la `x-api-key` o es inválida — o, en prod, el WAF bloqueó tu IP por exceso de requests (mismo cuerpo) | Manda la key. En prod es obligatoria siempre. Si una key que funcionaba empieza a dar `403` en ráfaga, baja el ritmo |
    | `429 {"message":"Too Many Requests"}` | Throttle por segundo de tu key (los `GET` tienen uno más holgado que las escrituras) | Reintenta con backoff; en el polling, espera como un `202` |
    | `429 {"message":"Limit Exceeded"}` | Agotaste el techo diario de requests de tu key (cuenta todo, incluido el polling) | No se arregla reintentando: se reinicia a la medianoche UTC |
    | `429 DAILY_DOCUMENT_LIMIT` | Tu app ya usó su tope de documentos del día (solo cuentan `POST /documents` y reprocess) | Espera a `resetsAt` (`Retry-After`); los `GET` siguen funcionando |
    | `403 AccessDenied` con `<HeadersNotSigned>` (XML) | En el `PUT` del paso 2 mandaste cabeceras `x-amz-*` | Quítalas: esa metadata ya viaja dentro de la URL |
    | `403 SignatureDoesNotMatch` (XML) | La `uploadUrl` se alteró, o ya expiró | Repite el paso 1; las URLs no se renuevan |
    | `400 INLINE_UPLOAD_REMOVED` | Mandaste el archivo en `contentBase64` | El modo inline ya no existe: usa los dos pasos |
    | `400 DOCUMENT_TYPE_REQUIRED` | Subiste `.xml`/`.xlsx`/`.csv` sin `documentType` | Esos formatos lo exigen: no hay clasificación automática sobre datos ya estructurados |
    | `202` al consultar el resultado | Sigue en `AWAITING_UPLOAD`, `QUEUED` o `PROCESSING` | Respeta `Retry-After`; usa backoff con jitter |
    | `404` al consultar el resultado | El id no existe o la app no puede verlo | No lo reintentes como si estuviera procesando |

    Dos reglas que se deducen de la tabla y conviene tener presentes:

    - **`Missing Authentication Token` ≠ problema de credenciales.** Una key
      ausente o mala siempre da `Forbidden`. Si ves el primero, el fallo está
      en la URL o en el método.
    - **Los errores de S3 vienen en XML, no en JSON.** Los del paso 2 no llevan
      el shape `{error, message}` del resto de la API: son respuestas de S3.

    ## Trampas conocidas

    - **El `/prod` de más.** Con `https://idp.alsuper.com` la ruta es
      `/documents`. El stage solo va en la URL cruda `execute-api`.
    - **Comillas en la `uploadUrl`.** Una URL real trae ~12 `&` en unos 1,900
      caracteres. Al pegarla en shell van comillas **simples** (`'...'`); al
      usarla desde una variable, **dobles** (`"$UPLOAD_URL"`). Sin comillas, el
      shell corta en el primer `&` y el `PUT` va a una URL truncada.
    - **El paso 2 responde `200` con cuerpo vacío.** S3 no devuelve JSON; un
      cliente que intente parsearlo falla sobre una petición que salió bien.
    - **No mandes `x-api-key` en el paso 2.** Va a S3, no a esta API.

    ---

    Este spec es el contrato formal de la API; la guía narrativa con ejemplos
    curl completos, notas de seguridad y el apéndice de "dónde queda el
    resultado" vive en `API_USO.md` (mismo directorio). Para un runbook de
    copiar y pegar paso a paso: `ejemplos/curl.md`.
externalDocs:
  description: Guía de uso completa (español, con ejemplos curl)
  url: ./API_USO.md
servers:
  - url: https://idp.alsuper.com
    description: >
      **prod (default)** — dominio propio. Exige `x-api-key` en todos los
      endpoints.


      **La ruta NO lleva el stage.** El dominio ya está mapeado al stage `prod`
      (base path vacío), así que es `https://idp.alsuper.com/documents`, no
      `.../prod/documents`. Poner `/prod` de más es el error más común contra
      este dominio y produce un `Missing Authentication Token` que parece de
      credenciales y no lo es.
  - url: "{apiEndpoint}"
    description: >
      dev — URL execute-api cruda del stack `DocumentValidationStack-Dev`. Aquí
      el stage **sí** va en la ruta (`.../prod/documents`), porque no hay
      dominio mapeado. Exige `x-api-key` si se desplegó con
      `DEV_API_KEY_REQUIRED=true`; sin esa variable queda abierta, pero igual
      acepta la key, así que mándala siempre y tu cliente sirve en los dos
      ambientes. Sale del output `ApiEndpoint` del stack.
    variables:
      apiEndpoint:
        default: https://REPLACE-ME.execute-api.us-east-1.amazonaws.com/prod
# `x-api-key` es el default del contrato: prod siempre la exige y dev la exige
# en cuanto se despliega con DEV_API_KEY_REQUIRED=true. Se documenta como
# REQUERIDA a propósito — un dev abierto es una comodidad de pruebas, no el
# contrato: un integrador que se guíe por este spec debe mandar la key siempre,
# y así el mismo código funciona en los dos ambientes sin cambios.
security:
  - ApiKeyAuth: []
tags:
  - name: Subir un documento
    description: >
      Los dos pasos de una subida: `POST /documents` registra el documento y
      devuelve una URL prefirmada, y el `PUT` lleva el archivo a S3. El endpoint
      NO recibe el archivo en ningún momento.
  - name: Consultar documentos
    description: Resultados, reproceso, archivo original y búsqueda por campo.
  - name: Tipos de documento
    description: >
      Catálogo de tipos soportados: qué tipos existen, su nombre/descripción,
      y el schema (campos, tipos, dónde vive cada dato) que la extracción
      llena para cada uno. Útil para armar un selector de tipo o generar un
      cliente sin tener que leer los JSON activos de `catalogs/base/` y
      `catalogs/custom/` del repo.
  - name: Referencias de autenticidad
    description: >
      Registro de las firmas, sellos y logos **válidos** de una entidad (p. ej.
      un proveedor), contra los que los tipos con verificación de autenticidad
      (hoy `CARTA_NOM35`) comparan cada documento. Una referencia pertenece a
      la ENTIDAD (`scope` + `key`), no a un tipo de documento.


      **El alta son tres peticiones**, igual que una subida: `POST
      /references/{scope}/{key}` reserva y devuelve `uploadUrl`; un `PUT` lleva
      el recorte a S3 (**sin** `x-api-key` y **sin** cabeceras extra, mismo
      contrato que `PUT /{uploadUrl}`); y `POST .../confirm` lo revisa y lo
      activa, respondiendo en el momento. Una vez activa se usa en los
      documentos que se procesen **después** con `metadata.proveedor` igual a
      `key`.


      **Permiso:** todas estas rutas, **también los `GET`**, exigen que la app
      tenga `AllowReferenceWrite` (apagado por default; se concede con `pnpm
      apps:grant -- --name APP --reference-write`). Sin él, `403 FORBIDDEN`.
      Falla cerrado: una key no registrada como app también es `403`.


      **Límites:** no cuentan contra el tope de documentos por día. `POST` y
      `DELETE` usan el throttle de escritura; los `GET`, el de lectura.
      Ejemplos completos en `API_USO.md` §8.
paths:
  /{uploadUrl}:
    put:
      operationId: putFileToPresignedUrl
      tags: [Subir un documento]
      summary: "Paso 2 de 4: subir el archivo a la uploadUrl (host S3)"
      servers:
        - url: "https://{bucket}.s3.{region}.amazonaws.com"
          description: >
            **S3, no esta API.** La URL completa —incluida la firma— viene en
            `uploadUrl` del paso 1; no se arma a mano. Por eso "Try it" no
            funciona aquí: cada URL está firmada para un objeto y un momento
            concretos.
          variables:
            bucket:
              default: documentvalidationstack-dev-documentbucket
            region:
              default: us-east-1
      security: []
      description: >
        Sube los bytes del archivo a la URL prefirmada que devolvió el paso 1.
        En cuanto S3 recibe el objeto, el pipeline arranca solo
        (`S3 → SQS → Step Functions → Textract/Bedrock → DynamoDB`).


        Se documenta como operación aparte porque **es una petición que tu
        integración debe hacer**, aunque no vaya a este API sino a S3
        directamente. Sin ella el documento nunca se procesa.


        - **Sin autenticación.** La autorización va firmada en la URL. **No
        mandes `x-api-key`**: esta petición no pasa por API Gateway.

        - **No mandes ninguna cabecera extra.** Al prefirmar, SigV4 *hoistea*
        los `x-amz-*` al query string: la metadata del documento ya va dentro de
        la URL y firmada. Añadirla como header hace que S3 responda
        `403 AccessDenied: There were headers present in the request which were
        not signed`. Si necesitas fijar el `Content-Type` del objeto guardado,
        ése sí puedes mandarlo (no es `x-amz-*`, S3 no exige que esté firmado).

        - **El cuerpo son los bytes crudos.** No multipart, no form-data, no
        base64.

        - **Usa la `uploadUrl` COMPLETA, tal cual.** No hay que separar ni
        reconstruir parámetros: la firma, el objeto de destino y la metadata del
        documento ya viajan dentro. En shell, pégala entre comillas **simples**
        — una URL real ronda los 1,900 caracteres con ~12 `&`, y sin comillas se
        parte en el primero.

        - **Caduca a los 15 min** (`uploadExpiresAt`). Si expira, repite el paso
        1: las URLs no se renuevan.

        - Hasta **5 GB**. No pasa por API Gateway (tope 10 MB) ni Lambda (6 MB).
      requestBody:
        required: true
        description: Los bytes del archivo, sin envolver.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: >
            Subido. **El cuerpo viene vacío** — S3 no devuelve JSON. Un cliente
            que intente parsearlo falla sobre una respuesta que en realidad
            salió bien.
        "403":
          description: >
            `AccessDenied` o `SignatureDoesNotMatch`, en XML (no JSON). Las dos
            causas habituales: mandaste cabeceras `x-amz-*` de más —el mensaje
            las lista en `<HeadersNotSigned>`— o la URL ya expiró. Si expiró,
            repite el paso 1.
      parameters:
        - name: uploadUrl
          in: path
          required: true
          description: >
            No es un parámetro que armes: usa la `uploadUrl` completa del paso
            1, tal cual, con su query string de firma.
          schema: { type: string }

  /documents/{id}:
    get:
      operationId: getDocumentById
      tags: [Consultar documentos]
      summary: "Paso 3 de 4: consultar el resultado del documento"
      description: >
        `{id}` puede ser el id completo o un prefijo (gana el primer match).
        `result` es el envelope completo, el mismo que se guarda en DynamoDB
        y se publica en EventBridge — ver `API_USO.md` §2 para
        el shape anotado campo por campo.
      parameters:
        - $ref: "#/components/parameters/DocumentIdPath"
        - name: full
          in: query
          description: >
            `1`/`true` agrega `fullResult`: el detalle más profundo desde S3
            (fields[] con extractedValue/normalizedValue/confidence/status/checks).
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Estado terminal (`FINISHED` con resultado o `FAILED` técnico).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResult" }
              examples:
                finished:
                  summary: Procesamiento terminado con resultado de negocio
                  value:
                    documentId: e18d014a-...
                    processingStatus: FINISHED
                    workflowStatus: complete
                    documentType: FACTURA_FLETE_EXTRANJERO
                    result:
                      envelopeVersion: 2
                      documentClassification: FACTURA_FLETE_EXTRANJERO
                      documentMatchesType: true
                      rejectionConfidence: 0.0
                      detectedDocument: null
                      documentCount: 1
                      validation: { status: APROBADO, reviewRequired: false }
                      documents:
                        - index: 1
                          documentType: FACTURA_FLETE_EXTRANJERO
                          status: APPROVED
                          fields:
                            NUMERO_FACTURA: { value: SJ191703, confidence: 0.98, valid: true }
                            TOTAL: { value: 14612.4, confidence: 0.93, valid: true }
                technicalFailure:
                  summary: Falla técnica terminal sin resultado
                  value:
                    documentId: e18d014a-...
                    processingStatus: FAILED
                    workflowStatus: enrichment-failure
                    documentType: FACTURA_FLETE_EXTRANJERO
                    result: null
        "202":
          description: >
            Trabajo conocido pero aún no terminal: `AWAITING_UPLOAD`, `QUEUED`
            o `PROCESSING`. El cliente debe respetar `Retry-After` y aplicar
            backoff con jitter; no necesita adivinar cuánto tardará.
          headers:
            Retry-After:
              description: Mínimo de segundos antes del siguiente GET.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResult" }
              examples:
                processing:
                  summary: Documento todavía en procesamiento
                  value:
                    documentId: e18d014a-...
                    processingStatus: PROCESSING
                    workflowStatus: pending
                    documentType: FACTURA_FLETE_EXTRANJERO
                    result: null
                    retryAfterSeconds: 5
        "404":
          description: >
            `NOT_FOUND`: no hay documento con ese id/prefijo, o existe pero la
            app que llama no tiene permiso de verlo. Es la misma
            respuesta a propósito, para no confirmar que un documento fuera de
            alcance exista. Un documento que todavía procesa devuelve `202`,
            nunca `404`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /documents/{id}/reprocess:
    post:
      operationId: reprocessDocument
      tags: [Consultar documentos]
      summary: Reprocesar el archivo original bajo un documentId nuevo
      description: |
        Localiza el archivo original del documento anterior en
        `processed/{id}/` o `failed/{id}/`, verifica que la app pueda verlo y
        crea una copia interna en `raw/` con un `documentId` nuevo. La copia
        dispara el mismo pipeline que una subida normal; los bytes no pasan
        por API Gateway ni por la Lambda y el resultado anterior no se modifica.

        Si `documentType` se omite, se hereda la declaración explícita del
        trabajo anterior cuando existe. Enviar `documentType: null` o `""`
        fuerza clasificación automática. `occurrenceMode`, `:N`/`:all` y
        `modelId` tienen el mismo contrato que en `POST /documents` y sólo
        afectan la ejecución nueva. La metadata vigente del documento anterior
        se conserva.
      parameters:
        - $ref: "#/components/parameters/DocumentIdPath"
      requestBody:
        required: false
        description: Vacío para heredar el tipo explícito anterior (o auto si no existía).
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReprocessRequest" }
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/ReprocessRequest" }
      responses:
        "202":
          description: |
            Copia aceptada y trabajo nuevo en cola. `Location` y `statusUrl`
            apuntan a `GET /documents/{nuevoId}`; respeta `Retry-After`.
          headers:
            Location:
              schema: { type: string }
              description: Ruta del trabajo nuevo.
            Retry-After:
              schema: { type: integer, minimum: 1 }
              description: Espera mínima sugerida antes del primer GET.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReprocessResponse" }
        "400":
          description: >
            INVALID_JSON, INVALID_BODY, INVALID_DOCUMENT_TYPE,
            INVALID_OCCURRENCE_MODE, INVALID_FORMAT o DOCUMENT_TYPE_REQUIRED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: >
            FORBIDDEN si la key no está registrada; FORBIDDEN_DOCUMENT_TYPE si
            el nuevo tipo queda fuera de AllowedDocTypes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: >
            NOT_FOUND si no existe/no es visible; FILE_NOT_FOUND si ya no está
            el objeto original en processed/ ni failed/.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: SOURCE_NOT_READY; el archivo todavía permanece en raw/ procesándose.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: JOB_REGISTRATION_FAILED o REPROCESS_COPY_FAILED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/TooManyRequestsDocuments" }

  /documents/{id}/metadata:
    patch:
      operationId: patchDocumentMetadata
      tags: [Consultar documentos]
      summary: Actualizar metadata externa sin alterar la validación
      description: |
        Aplica un JSON Merge Patch plano sobre la metadata mutable del
        documento. Sirve para estados transitorios y marcas propios de la app
        (`RECIBIDO`, `EN_REVISION`, `ENVIADO_A_ERP`, etc.); **no cambia**
        `validation.status`, `workflowStatus`, el resultado publicado en
        EventBridge ni el JSON histórico de S3.

        - Un valor escalar crea o reemplaza una clave.
        - `null` o `""` elimina esa clave.
        - Una clave ausente se conserva.
        - Claves en minúsculas tras normalizar, con forma
          `[a-z0-9][a-z0-9._-]*`; valores planos US-ASCII; 2 KB para el mapa
          resultante completo.
        - `app-origin`, `model-id`, `extraction-mode` y `document-counts` son reservadas y no se pueden modificar.

        Las apps registradas necesitan `AllowMetadataWrite=true` (se otorga
        con `pnpm apps:grant -- --name APP --metadata-write`) y solo pueden
        modificar documentos permitidos por su `AccessScope` y
        `AllowedDocTypes`. `{id}` acepta id completo o prefijo.
      parameters:
        - $ref: "#/components/parameters/DocumentIdPath"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/MetadataPatch" }
            example:
              estado_externo: EN_REVISION
              folio_erp: "4711"
              marca_anterior: null
          application/json:
            schema: { $ref: "#/components/schemas/MetadataPatch" }
      responses:
        "200":
          description: Metadata actualizada; devuelve el mapa completo resultante.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetadataPatchResponse" }
        "400":
          description: "INVALID_JSON, INVALID_METADATA o EMPTY_PATCH."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: "FORBIDDEN; la app no tiene AllowMetadataWrite."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Documento inexistente o fuera del alcance de la app.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: "METADATA_CONFLICT; reintentar el mismo PATCH."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /documents/{id}/file:
    get:
      operationId: getDocumentFile
      tags: [Consultar documentos]
      summary: "Paso 4 de 4: obtener el archivo original (URL de descarga)"
      description: >
        Devuelve una URL prefirmada (no los bytes) para el archivo tal cual
        se subió — PDF/imagen/XML/XLSX/CSV original, no el resultado de la
        extracción. Sin tope de tamaño real: el cliente descarga directo de
        S3, sin pasar por Lambda ni API Gateway.
      parameters:
        - $ref: "#/components/parameters/DocumentIdPath"
        - name: expiresIn
          in: query
          description: Segundos de validez de la URL. Fuera de [60, 3600] se recorta, no da error.
          schema: { type: integer, default: 900, minimum: 60, maximum: 3600 }
      responses:
        "200":
          description: URL prefirmada emitida.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileDownloadResponse" }
        "404":
          description: >
            `NOT_FOUND` (documento inexistente o sin permiso, igual que
            `GET /documents/{id}`) o `FILE_NOT_FOUND` (el documento existe y
            es visible, pero el objeto original no está en `processed/`/`failed/`
            todavía — p. ej. sigue en PROCESSING).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /documents:
    post:
      operationId: createDocument
      tags: [Subir un documento]
      summary: "Paso 1 de 4: registrar el documento y obtener la URL de subida"
      description: >
        **Este endpoint no recibe el archivo.** Registra el documento, acuña su
        `documentId` y devuelve una URL prefirmada de S3 para subirlo. El
        pipeline arranca en el paso 2, cuando S3 recibe los bytes.


        **Son dos pasos, siempre, sin importar el tamaño del archivo:**


        1. `POST /documents` con solo metadata → devuelve `uploadUrl`.

        2. `PUT {uploadUrl}` con el archivo → va directo a S3, y el pipeline
        arranca en cuanto S3 recibe el objeto.


        El archivo nunca pasa por API Gateway ni por el Lambda: API Gateway topa
        un request en 10MB y Lambda una invocación síncrona en 6MB (límites duros
        de AWS, no configurables), mientras que un `PUT` a S3 acepta hasta 5GB.
        Así no hay rama por tamaño que se pueda equivocar.


        **Migración:** el modo inline (`contentBase64` en el body) fue eliminado.
        Un request que lo mande recibe `400 INLINE_UPLOAD_REMOVED` con el flujo
        nuevo, en vez de fallar en silencio.


        El body puede ir como `application/json` o como
        `application/x-www-form-urlencoded`; ambos aceptan los mismos campos.
        Como todo valor de un formulario es texto, ahí `metadata` va como un
        objeto JSON codificado en string (`metadata={"lote":"A123"}`); si no es
        JSON válido, la respuesta es `400 INVALID_METADATA`.


        **El `PUT` del paso 2 no lleva ninguna cabecera extra.** La firma y la
        metadata del documento viajan en el query string de `uploadUrl`; añadir
        cabeceras `x-amz-*` hace que S3 rechace la subida.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
            examples:
              pedimento:
                summary: Pedimento con tipo declarado
                value:
                  fileName: pedimento.pdf
                  documentType: PEDIMENTO_ERP
                  occurrenceMode: single
                  metadata: { lote: "A123" }
              variasFacturas:
                summary: Todas las facturas de flete encontradas
                value:
                  fileName: facturas.pdf
                  documentType: FACTURA_FLETE_EXTRANJERO
                  occurrenceMode: multiple
              autoClassify:
                summary: Sin tipo — Bedrock clasifica y segmenta solo
                value:
                  fileName: expediente.pdf
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/UploadRequest"
            examples:
              presigned:
                summary: Prefirmado desde un cliente que solo manda formularios
                value:
                  fileName: expediente.pdf
                  documentType: PEDIMENTO_ERP
                  occurrenceMode: single
      responses:
        "200":
          description: >
            Solicitud aceptada y URL de subida emitida. El documento todavía NO
            existe: el pipeline arranca hasta que el `PUT` del paso 2 deposite
            el archivo en S3.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
              examples:
                pedimento:
                  value:
                    documentId: e18d014a-...
                    bucket: documentvalidationstack-...
                    key: raw/PEDIMENTO_ERP/e18d014a-.../pedimento.pdf
                    documentType: PEDIMENTO_ERP
                    occurrenceMode: single
                    documentTypeCounts: { PEDIMENTO_ERP: 1 }
                    classificationMode: manual
                    uploadUrl: "https://...s3.amazonaws.com/..."
                    uploadMethod: PUT
                    uploadExpiresInSeconds: 900
                    uploadExpiresAt: "2026-07-27T13:33:19.000Z"
                    uploadedAt: "2026-07-27T13:18:19.000Z"
                    registeredAt: "2026-07-27T13:18:19.000Z"
                    processingStatus: AWAITING_UPLOAD
                    statusUrl: /documents/e18d014a-...
                    retryAfterSeconds: 5
          links:
            # Encadenado formal de los pasos: los valores de ESTA respuesta
            # alimentan las operaciones siguientes, para no copiarlos a mano.
            subirElArchivo:
              operationId: putFileToPresignedUrl
              description: >
                **Paso 2.** Toma la `uploadUrl` de esta respuesta y sube ahí el
                archivo. Es la petición que dispara el pipeline: sin ella el
                documento nunca llega a S3. Caduca en 15 min.
              parameters:
                uploadUrl: $response.body#/uploadUrl
            consultarElResultado:
              operationId: getDocumentById
              description: >
                **Paso 3.** Consulta el resultado con el `documentId` de esta
                respuesta. Responde `202` durante `AWAITING_UPLOAD`, `QUEUED`
                y `PROCESSING`; respeta `Retry-After`. `404` significa que no
                existe o que la app no puede verlo.
              parameters:
                id: $response.body#/documentId
            descargarElOriginal:
              operationId: getDocumentFile
              description: >
                **Paso 4** (opcional). Recupera el archivo tal como se subió,
                con el mismo `documentId`.
              parameters:
                id: $response.body#/documentId
        "400":
          description: >
            Body inválido. Códigos posibles:


            - `MISSING_FIELD` — falta `fileName`.

            - `INVALID_FORMAT` — extensión fuera de
            pdf/jpg/jpeg/png/xml/xlsx/csv.

            - `DOCUMENT_TYPE_REQUIRED` — el archivo es `.xml`/`.xlsx`/`.csv` y
            falta `documentType` (esos formatos no tienen clasificación
            automática por visión).

            - `INVALID_DOCUMENT_TYPE` — algún `documentType` no es UPPER_SNAKE_CASE,
            la lista pasa de 8 tipos o 200 caracteres, o trae varios tipos en un
            `.xml`/`.xlsx`/`.csv` (ahí sólo se acepta uno).

            - `INVALID_OCCURRENCE_MODE` — `occurrenceMode` no es `single` ni
            `multiple`.

            - `INVALID_EXTRACTION_MODE` — `extractionMode` no es `catalog`,
            `model`, `hybrid` ni `deterministic`.

            - `INVALID_JSON` — el body no es JSON válido.

            - `INVALID_METADATA` — el `metadata` no es guardable como metadata
            de objeto S3: un valor anidado, un carácter no US-ASCII, más de
            2 KB entre claves y valores, o (en un body de formulario) un JSON
            en string que no parsea. El detalle va en `message`, con la clave
            concreta. Ver el campo `metadata` en `UploadRequest`.

            - `INLINE_UPLOAD_REMOVED` — el body trae `contentBase64`. El modo
            inline se eliminó; usa el flujo de dos pasos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: >
            `PRESIGN_FAILED` — no se pudo firmar la URL; o
            `JOB_REGISTRATION_FAILED` — no se pudo reservar el estado inicial
            en DynamoDB. Ambos son reintentables: no se devolvió una URL al
            cliente, así que basta con repetir el `POST`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/TooManyRequestsDocuments" }

    get:
      operationId: searchDocuments
      tags: [Consultar documentos]
      summary: Buscar documentos por tipo, sistema, metadata y campos extraídos
      # Bloque LITERAL (`|`), no plegado (`>`): las tablas markdown de abajo
      # necesitan sus saltos de línea reales — `>` une las líneas seguidas y
      # una tabla acaba renderizada como un párrafo con pipes.
      description: |
        Cuatro filtros, **todos combinables y todos en AND** — un documento
        tiene que cumplirlos todos para salir en `matches`. Basta mandar uno:


        | Filtro | Qué acota | De dónde sale el dato |
        | --- | --- | --- |
        | `docType` | El tipo de documento | Columna indexada `DocumentType`. **Es el único que se filtra dentro de DynamoDB** (Query al GSI `DocumentTypeIndex`, sin Scan) |
        | `system` | Qué sistema lo subió | `tracking.appOrigin`, resuelto de la **API key** del `POST /documents` — no de nada que mande el cliente en el body |
        | `meta.<clave>` | La metadata del upload | El objeto `metadata` del `POST /documents`, tal cual, sin interpretarlo |
        | `field`+`value` | Cualquier campo extraído | El envelope del resultado. Se puede repetir para exigir varios campos a la vez |


        Solo `docType` se resuelve en DynamoDB; los otros tres se aplican en la
        Lambda sobre lo que ese primer filtro dejó pasar, así que **mándalo
        siempre que puedas**: es lo que evita el Scan.


        **Cómo se combinan:** filtros distintos son AND
        (`system=ERP&meta.lote=A123` = del ERP *y* del lote A123); repetir uno
        es OR (`system=ERP,PORTAL`, `meta.lote=A123,B456`,
        `docType=FACTURA,PEDIMENTO_ERP`). Los `field`/`value` repetidos se
        emparejan **por posición** en la URL y son AND entre sí; si el número
        de `field` y de `value` no coincide → `400`, no una pareja inventada.
        Un documento sin `metadata` (o sin `appOrigin`) nunca matchea un
        filtro `meta.*`/`system`: no hay comodín.


        **No necesitas el dot-path completo: basta el NOMBRE del campo.** Si el
        path no resuelve en la raíz del envelope, se hace una búsqueda profunda
        por su última clave, así que `field=No_Pedimento` lo encuentra esté
        donde esté anidado. `matchedAt` en cada match dice dónde coincidió: el
        path exacto, o `*.CLAVE` si fue por búsqueda profunda.


        La comparación es sobre texto, sin distinguir mayúsculas y recortando
        espacios. `op=contains` busca subcadena; el default `eq` exige igualdad.


        **Tres caminos de acceso; `lookup` en la respuesta dice cuál contestó:**


        | `lookup` | Cuándo | Costo |
        | --- | --- | --- |
        | `uniqueKey` | **Alguno** de los `field` está declarado `unique_key` en el catálogo del tipo, con `docType` y `op=eq` | **Una** Query, sin importar cuántos documentos existan. Los demás filtros (`system`, `meta.*`, los otros campos) se aplican solo sobre lo que devolvió |
        | `typeIndex` | Hay `docType`, pero el campo no es unique key | Query al GSI del tipo + filtrado en la Lambda |
        | `scan` | **No mandaste `docType`** | Scan de toda la tabla — evítalo |


        Hoy `PEDIMENTO_ERP` declara `unique_key` en `No_Pedimento`,
        normalizado a solo dígitos: la
        misma normalización se aplica al escribir y al buscar, así que
        `26 07 0823 6001630` y `260708236001630` encuentran lo mismo.


        Si no se cumplen las condiciones del camino rápido, la búsqueda **cae al
        camino normal y encuentra el documento igual** — más lenta, nunca
        equivocada. Ver `catalogs/README.md` → "Unique keys".


        **Permiso aparte:** usar `field`/`value` requiere que la app tenga
        `AllowFieldSearch` (default **false**, por ser la ruta más cara). Sin él
        la respuesta es `403`, aunque el `docType` sí esté permitido.
        **`system` y `meta.<clave>` NO están detrás de ese permiso**: leen una
        sola clave conocida del envelope en vez de recorrerlo entero, y son
        justo lo que necesita una app con acceso normal por `docType` para
        reencontrar su propio documento ("el que subí para el lote A123").
      parameters:
        - name: docType
          in: query
          description: >
            TYPE_ID (`PEDIMENTO_ERP`) o nombre/alias normalizado. Varios
            tipos separados por coma. Alias del param: `documentType`, `tipo`.
          schema: { type: string }
        - name: system
          in: query
          description: >
            Qué sistema subió el documento: se compara contra
            `tracking.appOrigin`, que la API resuelve de la **API key** con la
            que se hizo el `POST /documents`. Una app no puede declararse otra
            — un `metadata: {"app-origin": "..."}` en el body se descarta.


            Varios sistemas separados por coma o repitiendo el parámetro (OR).
            Alias del param: `appOrigin`, `sistema`.


            Ortogonal a los permisos por app: una app con `AccessScope: "own"`
            ya está limitada a sus propios documentos, así que ahí este filtro
            solo puede acotar más. Es útil sobre todo para una app con
            `AccessScope: "all"` que quiere mirar un solo canal de entrada.
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
          example: ["ERP,PORTAL"]
        - name: meta.<clave>
          in: query
          description: >
            **Familia de parámetros**, no un parámetro literal: `meta.lote=A123`,
            `meta.sucursal=CHIH`... Filtra por la `metadata` que se mandó en el
            `POST /documents`, que viaja con el documento hasta su resultado.


            Las claves van en **minúsculas** (S3 las guarda así, y la API las
            baja a minúsculas en los dos extremos: `meta.Lote` y `meta.lote`
            son el mismo filtro). Claves distintas son AND; repetir una clave,
            o separar sus valores por coma, es OR.


            Solo encuentra documentos **subidos con esa metadata**: no es
            reconstruible hacia atrás, así que un documento ya procesado antes
            de mandarla nunca va a matchear.
          schema: { type: string }
          example: A123
        - name: metaOp
          in: query
          description: >
            Cómo comparan **todos** los `meta.<clave>`: `eq` exacto o
            `contains` subcadena. Independiente de `op`, que es para
            `field`/`value`.
          schema: { type: string, enum: [eq, contains], default: eq }
        - name: field
          in: query
          description: >
            Dot-path del campo extraído, p. ej.
            `No_Pedimento` (basta el nombre; también se acepta un
            dot-path). Si no resuelve
            en la raíz, hace búsqueda profunda por la última clave del path.
            Cuando es la `unique_key` declarada por el tipo (con `docType` y
            `op=eq`) se resuelve por la tabla de lookup en una sola Query.


            **Se puede repetir** (`?field=A&value=1&field=B&value=2`): los
            pares se emparejan por posición y se exigen todos (AND). Cada
            match devuelve `matched[]` con lo que coincidió por filtro.
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: value
          in: query
          description: >
            Valor a comparar (case-insensitive, recorta espacios). Requiere
            `field`, uno por cada `field` y en el mismo orden. En el camino de
            unique key se normaliza igual que al indexar, así que
            `26 07 0823 6001630` y `260708236001630` resuelven a la misma clave.
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: op
          in: query
          description: >
            Cómo comparan los `field`/`value`. Se puede mandar una vez (aplica
            a todos los filtros) o una vez por filtro, en el mismo orden;
            cualquier otra cantidad → `400 INVALID_PARAMS`.
          schema: { type: array, items: { type: string, enum: [eq, contains] } }
          style: form
          explode: true
        - name: status
          in: query
          description: Solo se aplica en DynamoDB junto con `docType`.
          schema: { type: string, enum: [APROBADO, RECHAZADO, REQUIERE_REVISION] }
        - name: since
          in: query
          description: "ISO-8601, p. ej. 2026-07-01. Solo con `docType`."
          schema: { type: string, format: date }
        - name: until
          in: query
          schema: { type: string, format: date }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: expand
          in: query
          description: "`0`/`false` desactiva la búsqueda dentro de expedientes multi-documento."
          schema: { type: boolean, default: true }
        - name: limit
          in: query
          schema: { type: integer, default: 25, maximum: 100 }
        - name: summary
          in: query
          description: "`1`/`true` devuelve solo un resumen ligero por match en vez del envelope completo."
          schema: { type: boolean, default: false }
        - name: full
          in: query
          description: "`1`/`true` agrega `fullResult` por match (detalle por-campo desde S3, un GET de S3 por match)."
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Resultados de la búsqueda.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentSearchResponse" }
        "400":
          description: |
            Códigos posibles:

            - `MISSING_PARAMS` — no mandaste ninguno de `docType`,
              `field`+`value`, `system` o `meta.<clave>`; o mandaste `field`
              sin su `value`; o el número de `field` y de `value` no coincide
              (se emparejan por posición, así que una lista desbalanceada es
              ambigua y no se adivina).

            - `INVALID_PARAMS` — mandaste varios `op` pero ni uno solo (que
              aplicaría a todos los filtros) ni uno por filtro.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: >
            `FORBIDDEN` — se pidió un `docType` fuera de `AllowedDocTypes` de
            la app, o se usó `field`/`value` sin `AllowFieldSearch`
            (`system`/`meta.<clave>` no requieren ese permiso).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /document-types:
    get:
      operationId: listDocumentTypes
      tags: [Tipos de documento]
      summary: Listar los tipos de documento del catálogo (paginado)
      description: >
        Página del catálogo de tipos, 5 por página, ordenados por `type`. Cada
        entrada trae `type` (el `documentType` que usas en `POST /documents`
        y en `?docType=`), `displayName` y `description`. El campo `schema`
        —el árbol de campos completo que la extracción llena— **se omite a
        menos que lo pidas explícitamente** con `includeSchema=1`: puede ser
        grande (decenas de campos anidados en un tipo como
        `PEDIMENTO_ADUANAL`), así que una página sin él es liviana por
        default.


        Refleja el catálogo **hot-reload**: un tipo sincronizado con
        `pnpm sync:one` aparece aquí de inmediato, sin esperar un redeploy. Si
        la app llamante tiene `AllowedDocTypes` configurado, la lista se
        acota a esos tipos — igual que en `GET /documents` sin `docType`.
      parameters:
        - name: page
          in: query
          description: Página, 1-indexada. Fuera de rango se recorta a la última página válida.
          schema: { type: integer, default: 1, minimum: 1 }
        - name: includeSchema
          in: query
          description: "`1`/`true` agrega `schema` a cada tipo de la página."
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Página del catálogo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentTypesPage" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /document-types/{type}:
    get:
      operationId: getDocumentType
      tags: [Tipos de documento]
      summary: Un tipo de documento por su TYPE_ID exacto
      description: >
        Igual que una fila de `GET /document-types`, pero para un solo tipo.
        `{type}` es el TYPE_ID exacto (case-insensitive) — el mismo valor de
        `documentType`/`docType` que usas en el resto del API. No resuelve
        alias ni nombres legibles (esos son pistas de clasificación para
        Bedrock, no un identificador estable): un TYPE_ID que no existe, o que
        existe pero está fuera de `AllowedDocTypes` de la app, responde `404`
        — no hay diferencia observable entre ambos casos, mismo principio que
        `GET /documents/{id}` con un id fuera de alcance.
      parameters:
        - name: type
          in: path
          required: true
          description: TYPE_ID exacto (p. ej. `PEDIMENTO_ERP`), case-insensitive.
          schema: { type: string }
        - name: includeSchema
          in: query
          description: "`1`/`true` agrega `schema` (el árbol de campos completo) a la respuesta."
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: El tipo de documento.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentTypeEntry" }
        "404":
          description: "`DOCUMENT_TYPE_NOT_FOUND` — no existe, o no es visible para esta app."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /references/{scope}/{key}:
    parameters:
      - $ref: "#/components/parameters/ReferenceScopePath"
      - $ref: "#/components/parameters/ReferenceKeyPath"
    post:
      operationId: reserveReference
      tags: [Referencias de autenticidad]
      summary: "Paso 1 de 3: reservar una referencia y obtener la URL de carga"
      description: >
        Crea la referencia en estado `PENDING` y devuelve una `uploadUrl`
        prefirmada de S3 (15 min). **No lleva la imagen.** `refId` sale de
        `label` (`"Lic. Julio Lemus"` → `lic-julio-lemus`); si ya existe una
        referencia activa o dada de baja con ese id se agrega un sufijo (`-2`,
        `-3`…), y si lo que existe es una reserva pendiente **se reutiliza**
        (un reintento no deja nada atrás).


        Después: `PUT` del recorte a `uploadUrl` —a S3, sin `x-api-key` y sin
        ninguna cabecera extra— y `POST` a `confirmUrl`. Una reserva que no se
        confirma vence en 24 h; mientras tanto no se lista ni se usa para
        comparar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferenceReserveRequest" }
            example:
              kind: FIRMA
              label: Lic. Julio Lemus
              fileName: firma-julio.png
      responses:
        "200":
          description: Reserva creada; sube el recorte a `uploadUrl` y confirma.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceReservation" }
        "400":
          description: >
            `INVALID_REFERENCE_KEY` (con `suggested`), `INVALID_SCOPE` o
            `INVALID_KIND` (con `valid`), `MISSING_FIELD` (falta `kind` o
            `label`), `INVALID_JSON`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceInputError" }
        "403": { $ref: "#/components/responses/ReferenceForbidden" }
        "409":
          description: >
            `REFERENCE_LIMIT_REACHED` — la entidad ya tiene 20 referencias
            activas de ese elemento; da de baja alguna. `REFERENCE_ID_EXHAUSTED`
            — demasiadas referencias con la misma etiqueta; usa otro `label`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    get:
      operationId: listReferences
      tags: [Referencias de autenticidad]
      summary: Listar las referencias de una entidad
      description: >
        Las referencias **activas** de la entidad, ordenadas por `kind` y
        `refId`. Las reservas pendientes nunca aparecen. Una entidad sin
        referencias responde `200` con `count: 0`.
      parameters:
        - name: kind
          in: query
          description: Solo las de este elemento (`FIRMA`, `SELLO`, `LOGO`).
          schema: { type: string }
        - name: includeInactive
          in: query
          description: "`1`/`true`/`yes` incluye también las dadas de baja."
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Referencias de la entidad.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceList" }
        "400":
          description: "`INVALID_REFERENCE_KEY`, `INVALID_SCOPE` o `INVALID_KIND`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceInputError" }
        "403": { $ref: "#/components/responses/ReferenceForbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /references/{scope}/{key}/{kind}/{refId}:
    parameters:
      - $ref: "#/components/parameters/ReferenceScopePath"
      - $ref: "#/components/parameters/ReferenceKeyPath"
      - $ref: "#/components/parameters/ReferenceKindPath"
      - $ref: "#/components/parameters/ReferenceIdPath"
    get:
      operationId: getReference
      tags: [Referencias de autenticidad]
      summary: Una referencia, con URL temporal de su imagen
      description: >
        La ficha de la referencia. Si está **activa** trae además `imageUrl`
        (URL prefirmada de S3, 5 min; se descarga sin `x-api-key`) e
        `imageUrlExpiresInSeconds`; una dada de baja o pendiente devuelve la
        ficha sin ellas. Nunca devuelve la huella de tinta ni el embedding.
      responses:
        "200":
          description: La referencia.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceDetail" }
        "400":
          description: "`INVALID_REFERENCE_KEY`, `INVALID_SCOPE` o `INVALID_KIND`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceInputError" }
        "403": { $ref: "#/components/responses/ReferenceForbidden" }
        "404":
          description: "`NOT_FOUND` — no existe, o era una reserva ya vencida."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      operationId: deactivateReference
      tags: [Referencias de autenticidad]
      summary: Dar de baja (desactivar) una referencia
      description: >
        **Solo desactiva.** La referencia deja de compararse y sale del índice
        de similitud, pero su registro y su imagen se conservan para auditoría
        (visibles con `includeInactive=1`). El borrado definitivo no está en
        el API: es una operación de operador (`pnpm refs:remove --delete`).
        Devuelve la ficha con `status: INACTIVE`, `deactivatedAt` y
        `deactivatedBy`.
      responses:
        "200":
          description: La referencia, ya inactiva.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reference" }
        "400":
          description: "`INVALID_REFERENCE_KEY`, `INVALID_SCOPE` o `INVALID_KIND`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceInputError" }
        "403": { $ref: "#/components/responses/ReferenceForbidden" }
        "404":
          description: "`NOT_FOUND` — no existe, o todavía es una reserva pendiente."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /references/{scope}/{key}/{kind}/{refId}/confirm:
    parameters:
      - $ref: "#/components/parameters/ReferenceScopePath"
      - $ref: "#/components/parameters/ReferenceKeyPath"
      - $ref: "#/components/parameters/ReferenceKindPath"
      - $ref: "#/components/parameters/ReferenceIdPath"
    post:
      operationId: confirmReference
      tags: [Referencias de autenticidad]
      summary: "Paso 3 de 3: revisar el recorte subido y activar la referencia"
      description: |
        Lee el recorte que subiste a `uploadUrl`, lo revisa con el mismo código
        que usa el pipeline y, si pasa, activa la referencia. Responde en el
        momento (no hay polling). Es idempotente: confirmar una referencia ya
        activa devuelve `200` con la misma ficha.

        Qué debe cumplir el recorte (solo el elemento, no la hoja completa):

        - PNG o JPEG legible, por contenido y no por extensión (`NOT_AN_IMAGE`).
        - Hasta 3.5 MB (`TOO_LARGE_BYTES`).
        - Lado menor ≥ 120 px; ≥ 80 px en elementos sin huella de tinta, como
          un logo (`TOO_SMALL`).
        - Lado menor ≤ 2200 px y no más de 12 megapíxeles
          (`TOO_LARGE_DIMENSIONS`).
        - Tinta distinguible sobre el fondo, en elementos con huella (`NO_INK`).

        Si no pasa, responde `422` y descarta la imagen subida; la reserva
        sigue pendiente, así que puedes subir otro recorte y confirmar de
        nuevo. `warnings` (p. ej. `TOO_MUCH_INK`) no impiden el alta.

        `force: true` registra una referencia aunque su tinta sea prácticamente
        la de otra ya registrada (`SIMILAR_REFERENCE`). No salta
        `DUPLICATE_REFERENCE` (exactamente el mismo archivo).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferenceConfirmRequest" }
            example:
              force: true
      responses:
        "200":
          description: Referencia activa.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceConfirmed" }
        "400":
          description: >
            `INVALID_REFERENCE_KEY`, `INVALID_SCOPE`, `INVALID_KIND` o
            `INVALID_JSON`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceInputError" }
        "403": { $ref: "#/components/responses/ReferenceForbidden" }
        "404":
          description: "`NOT_FOUND` — la referencia no existe o su reserva expiró."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: >
            `UPLOAD_NOT_FOUND` — todavía no se subió la imagen (o la `uploadUrl`
            expiró). `DUPLICATE_REFERENCE` — ese mismo archivo ya está
            registrado. `SIMILAR_REFERENCE` — misma tinta que otra ya
            registrada; reenvía con `force: true`. `NOT_PENDING` — la
            referencia está dada de baja; regístrala de nuevo. Los dos de
            duplicado traen `existing`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceConflict" }
              example:
                error: SIMILAR_REFERENCE
                message: "Misma tinta (0.99) que FIRMA#julio: una muestra basta. Reenvía con `force: true` para registrarla igual."
                existing: { kind: FIRMA, refId: julio }
        "422":
          description: "`REFERENCE_REJECTED` — el recorte no pasó la revisión de calidad."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceRejected" }
              example:
                error: REFERENCE_REJECTED
                message: El recorte no pasó la revisión de calidad.
                errors:
                  - code: TOO_SMALL
                    message: "muy chica (90x60); escanea a 200-300 dpi"
                warnings: []
        "429": { $ref: "#/components/responses/TooManyRequests" }

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: >
        Mándala **siempre**: es el contrato por default.


        Sin key válida, API Gateway responde `403` de forma nativa, sin
        invocar la Lambda (no hay costo de backend).


        **prod** la exige siempre. **dev** la exige cuando se desplegó con
        `DEV_API_KEY_REQUIRED=true` (`devApiKeyRequired` en
        `src/document-validation-stack.ts`); un dev sin esa variable queda
        abierto y **también acepta requests con key**, así que mandarla
        siempre funciona en ambos ambientes sin condicionales en tu cliente.


        Además de autenticar, la key decide **qué documentos** puede leer cada
        app (por default, solo los que ella subió) — ver `AllowedDocTypes` /
        `AccessScope` en `documentacion/AMBIENTES_Y_SEGURIDAD.md`. Sin key, esa
        restricción por app no aplica.


        **No la mandes en el `PUT` a S3** del paso 2: ese va firmado en la URL
        y no pasa por API Gateway.
  responses:
    TooManyRequests:
      description: >
        Límite de la API key alcanzado (ver "Límites y 429" arriba). Dos
        cuerpos posibles, ambos de API Gateway (sin `error` ni `Retry-After`):
        `{"message":"Too Many Requests"}` = throttle por segundo, reintenta con
        backoff (en el polling, espera como un `202`); `{"message":"Limit
        Exceeded"}` = techo diario de requests agotado, se reinicia a la
        medianoche UTC. Los `GET` tienen un throttle más holgado que las
        escrituras.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiGatewayMessage" }
    TooManyRequestsDocuments:
      description: >
        Igual que en el resto de las rutas (`Too Many Requests` / `Limit
        Exceeded`, de API Gateway), más un tercer caso propio de las rutas que
        crean un proceso: `DAILY_DOCUMENT_LIMIT`, la app ya usó su tope de
        documentos del día (subidas y reprocesos que pasaron validación). Trae
        `Retry-After` hasta `resetsAt` (medianoche UTC); los `GET` siguen
        funcionando.
      headers:
        Retry-After:
          description: Solo en DAILY_DOCUMENT_LIMIT — segundos hasta `resetsAt`.
          schema: { type: integer }
      content:
        application/json:
          schema:
            anyOf:
              - $ref: "#/components/schemas/DailyDocumentLimitResponse"
              - $ref: "#/components/schemas/ApiGatewayMessage"
    ReferenceForbidden:
      description: >
        `FORBIDDEN` — la app no tiene el permiso `AllowReferenceWrite` (lo
        exigen todas las rutas `/references`, también los `GET`), o su key no
        está registrada como app.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  parameters:
    DocumentIdPath:
      name: id
      in: path
      required: true
      description: Id completo del documento o un prefijo (gana el primer match).
      schema: { type: string }
    ReferenceScopePath:
      name: scope
      in: path
      required: true
      description: >
        Ámbito de la entidad: uno de los declarados por un tipo de documento
        activo en `authenticity.references.scope`. Hoy solo `PROVEEDOR`.
      schema: { type: string }
      example: PROVEEDOR
    ReferenceKeyPath:
      name: key
      in: path
      required: true
      description: >
        Identificador de la entidad dentro del `scope` (p. ej. el número de
        proveedor) — el mismo valor que se manda en `metadata.proveedor` al
        subir un documento. Solo letras, dígitos, `.`, `-` y `_`; una clave
        que cambiaría al normalizarse se rechaza con `INVALID_REFERENCE_KEY`
        y la forma válida en `suggested`.
      schema: { type: string, pattern: "^[A-Za-z0-9._-]+$" }
      example: "10040"
    ReferenceKindPath:
      name: kind
      in: path
      required: true
      description: Elemento — uno de los que declaran los tipos de ese `scope`.
      schema: { type: string }
      example: FIRMA
    ReferenceIdPath:
      name: refId
      in: path
      required: true
      description: Id de la referencia, tal como lo devolvió la reserva.
      schema: { type: string }
      example: lic-julio-lemus
  schemas:
    ApiGatewayMessage:
      type: object
      description: >
        Cuerpo de los errores que genera API Gateway por su cuenta (key
        inválida, WAF, throttle, cuota): no traen `error`, solo `message`.
      required: [message]
      properties:
        message:
          type: string
          example: Too Many Requests
    DailyDocumentLimitResponse:
      type: object
      required: [error, message, limit, resetsAt, retryAfterSeconds]
      properties:
        error: { type: string, enum: [DAILY_DOCUMENT_LIMIT] }
        message: { type: string }
        limit:
          type: integer
          description: Documentos por día permitidos a esta app.
        resetsAt:
          type: string
          format: date-time
          description: Próxima medianoche UTC, cuando el contador vuelve a cero.
        retryAfterSeconds: { type: integer }
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: >
            Código de error estable — programa contra este valor, no contra
            `message`. Upload: MISSING_FIELD, INVALID_FORMAT,
            DOCUMENT_TYPE_REQUIRED, INVALID_DOCUMENT_TYPE,
            INVALID_OCCURRENCE_MODE, INVALID_JSON, INVALID_METADATA,
            INLINE_UPLOAD_REMOVED, PRESIGN_FAILED,
            JOB_REGISTRATION_FAILED, DAILY_DOCUMENT_LIMIT.
            Consulta/escritura: NOT_FOUND, MISSING_PARAMS, INVALID_PARAMS,
            FORBIDDEN, FORBIDDEN_DOCUMENT_TYPE, EMPTY_PATCH,
            METADATA_CONFLICT, SOURCE_NOT_READY, FILE_NOT_FOUND,
            REPROCESS_COPY_FAILED. Tipos de documento:
            DOCUMENT_TYPE_NOT_FOUND. Referencias: INVALID_REFERENCE_KEY,
            INVALID_SCOPE, INVALID_KIND, MISSING_FIELD, INVALID_JSON,
            FORBIDDEN, NOT_FOUND, REFERENCE_LIMIT_REACHED,
            REFERENCE_ID_EXHAUSTED, UPLOAD_NOT_FOUND, DUPLICATE_REFERENCE,
            SIMILAR_REFERENCE, NOT_PENDING, REFERENCE_REJECTED,
            INTERNAL_ERROR.
        message: { type: string }
    UploadRequest:
      type: object
      required: [fileName]
      properties:
        fileName:
          type: string
          description: "Extensión soportada: pdf|jpg|jpeg|png|xml|xlsx|csv."
        contentBase64:
          deprecated: true
          type: string
          description: >
            ELIMINADO. El modo inline ya no existe; mandarlo devuelve
            `400 INLINE_UPLOAD_REMOVED`. Se documenta solo para que un cliente
            viejo encuentre aquí por qué dejó de funcionar. Usa el flujo de dos
            pasos (uploadUrl + PUT), que sirve para cualquier tamaño.
        documentType:
          type: string
          example: PEDIMENTO_ADUANAL,FACTURA_HONORARIOS
          description: >
            TYPE_ID del catálogo, o VARIOS separados por coma (misma convención
            que `?docType=` en `GET /documents`). Tres modos según cuántos mandes:


            - **uno** (`PEDIMENTO_ADUANAL`) — se honra tal cual: el archivo entero
            es ese tipo y no se re-clasifica ni se segmenta;

            - **varios** (`PEDIMENTO_ADUANAL,FACTURA_HONORARIOS`) — el archivo SÍ
            se segmenta y cada documento encontrado se clasifica, pero la lista es
            CERRADA: `documents[]` sólo contiene los tipos declarados; los demás
            segmentos se omiten antes de extracción. Cada documento lleva su
            propio esquema y rango `pageStart`/`pageEnd`;


            Cada tipo admite además **cuántos buscar**: `TIPO:N` o `TIPO:all`
            (`PEDIMENTO_ERP:1,FACTURA_FLETE_EXTRANJERO:all`). Sin sufijo usa
            `occurrenceMode` de este POST cuando se envía; si se omite, usa
            `occurrence_mode` del catálogo del tipo y después el default global
            (`single` con un tipo, `multiple` con varios). Un sufijo explícito
            prevalece por tipo. Si falta una ocurrencia
            pedida se agrega un marcador del tipo con `pageStart/pageEnd: null`,
            `status: REVIEW_REQUIRED`, `confidence: null` y `fields: {}`; el
            marcador activa revisión pero no cuenta en `documentCount` ni
            `validation.counts`.

            - **omitido** — Bedrock clasifica contra todo el catálogo.


            Máximo 8 tipos y 200 caracteres en total (viajan como un solo segmento
            de la llave de S3); si no, `400 INVALID_DOCUMENT_TYPE`.
            Obligatorio para `.xml`/`.xlsx`/`.csv` (400 DOCUMENT_TYPE_REQUIRED
            si falta) — esos formatos se extraen determinísticamente, sin Bedrock,
            y ahí aceptan **exactamente uno**: no hay clasificación por visión sobre
            datos ya estructurados, así que no hay nada que elegir entre varios
            esquemas (`400 INVALID_DOCUMENT_TYPE` si mandas una lista).
        occurrenceMode:
          type: string
          enum: [single, multiple]
          description: >
            Cardinalidad para los tipos declarados sin sufijo en ESTE POST.
            `single` conserva la primera ocurrencia de cada tipo; `multiple`
            conserva todas las ocurrencias físicas encontradas y sobrescribe
            `occurrence_mode` de todos los catálogos solicitados. Si se omite,
            cada catálogo decide; sólo si no lo define se usa `single` con un
            tipo y `multiple` con varios. Un sufijo
            `TIPO:N` o `TIPO:all` siempre prevalece sólo para ese tipo. El
            runtime acepta también `occurrence_mode` como alias de
            compatibilidad; no mandes ambos con valores distintos.
        occurrence_mode:
          type: string
          enum: [single, multiple]
          deprecated: true
          description: >
            Alias compatible de `occurrenceMode`. Usa `occurrenceMode` en
            integraciones nuevas. Si se mandan ambos, deben tener el mismo valor.
        modelId:
          type: string
          description: >
            Solo dev — procesa este documento con el modelo de Bedrock indicado,
            sin redeploy. El stack de prod lo ignora a propósito.
        extractionMode:
          type: string
          enum: [catalog, model, hybrid, deterministic]
          default: catalog
          description: >
            Solo dev — sobrescribe la extracción de campos para este documento.
            Efectos: `catalog` (default) busca `deterministic_extraction`; con
            mapper ejecuta código y respeta su fallback, sin mapper manda todos
            los campos a IA. `model` = IA PARA TODOS LOS CAMPOS; `hybrid` =
            CÓDIGO PRIMERO, IA PARA FALTANTES; `deterministic` = SÓLO CÓDIGO,
            FALTANTES A REVISIÓN. Pedir hybrid/deterministic sin mapper resuelve
            de forma segura a model. XML/tabular ignoran este override y se
            extraen por código. `deterministic` no impide que clasificación,
            segmentación, localización o autenticidad usen IA; `aiExecuted`
            confirma la ejecución completa. Prod ignora el override.
        metadata:
          type: object
          description: |
            Contexto propio del que sube (un lote, un folio del ERP, una
            sucursal): se conserva con el documento, viaja hasta su resultado
            y **es filtrable** después con
            `GET /documents?meta.<clave>=<valor>`. Este sistema nunca lo
            interpreta.

            Lo que S3 puede guardar como metadata de objeto, y solo eso —
            se valida aquí, no en el `PUT` del paso 2, donde el mismo error
            aparecería como un `403` de S3 que parece de permisos:

            - **Claves en minúsculas.** Se bajan a minúsculas de todos modos
              (S3 lo hace), así que `{"Lote": "A123"}` se busca luego igual
              con `meta.lote=` que con `meta.Lote=`.
              Solo admiten `[a-z0-9][a-z0-9._-]*`.
            - **Valores planos y US-ASCII.** Números y booleanos se guardan
              como texto. Un objeto/arreglo anidado, o un acento, → `400
              INVALID_METADATA`.
            - **2 KB en total** entre claves y valores (tope de S3) → `400
              INVALID_METADATA`.
            - `app-origin`, `model-id`, `extraction-mode` y `document-counts` son claves **del sistema** y se
              descartan en silencio: la primera es la trazabilidad que
              `?system=` filtra y sale de tu API key, no del body.

            En un body `x-www-form-urlencoded` va como objeto JSON en string
            (`metadata={"lote":"A123"}`); si no es JSON válido → `400
            INVALID_METADATA`.
          additionalProperties: true
          example: { lote: "A123", sucursal: "CHIH" }
    ReprocessRequest:
      type: object
      properties:
        documentType:
          type: [string, "null"]
          example: PEDIMENTO_ERP:1,FACTURA_FLETE_EXTRANJERO:all
          description: >
            Uno o varios TYPE_ID separados por coma, con los mismos sufijos
            `:N`/`:all` de POST /documents. Omitido hereda la declaración
            explícita del trabajo anterior; null o string vacío fuerza auto.
        occurrenceMode:
          type: string
          enum: [single, multiple]
          description: >
            Sobrescribe catálogo/default para los tipos sin sufijo en el
            reproceso nuevo. `:N`/`:all` conserva precedencia.
        occurrence_mode:
          type: string
          enum: [single, multiple]
          deprecated: true
          description: Alias compatible de occurrenceMode.
        modelId:
          type: string
          description: Override de modelo para la ejecución nueva; sólo se honra en dev.
    ReprocessResponse:
      type: object
      required:
        [documentId, reprocessedFrom, documentType, occurrenceMode,
         classificationMode, processingStatus, statusUrl, retryAfterSeconds]
      properties:
        documentId:
          type: string
          description: Id nuevo; el id anterior y su resultado permanecen intactos.
        reprocessedFrom:
          type: string
          description: Id completo del documento usado como fuente.
        documentType:
          type: [string, "null"]
          description: Tipos efectivos sin sufijos, o null para auto.
        occurrenceMode:
          type: [string, "null"]
          enum: [single, multiple, null]
        documentTypeCounts:
          type: object
          additionalProperties:
            oneOf:
              - type: integer
                minimum: 1
              - type: string
                enum: [all]
        classificationMode:
          type: string
          enum: [manual, guided, auto]
        processingStatus:
          type: string
          enum: [QUEUED]
        statusUrl: { type: string }
        retryAfterSeconds: { type: integer, minimum: 1 }
    MetadataPatch:
      type: object
      minProperties: 1
      description: >
        JSON Merge Patch plano. Valores string/number/boolean crean o
        reemplazan; null o string vacío eliminan. Los estados son propios de
        la integración y no cambian el estado canónico de validación.
      additionalProperties:
        oneOf:
          - type: string
          - type: number
          - type: boolean
          - type: "null"
      example: { estado_externo: EN_REVISION, folio_erp: "4711", marca_anterior: null }
    MetadataPatchResponse:
      type: object
      required: [documentId, metadata, metadataVersion, updatedAt, updatedBy]
      properties:
        documentId: { type: string }
        metadata:
          type: object
          additionalProperties: { type: string }
          description: Mapa completo después de aplicar el merge patch.
        metadataVersion: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
        updatedBy:
          type: string
          description: App registrada que hizo el cambio (`dev-unrestricted` en dev abierto).
    UploadResponse:
      type: object
      description: >
        Los campos `upload*` son el contrato del paso 2: con ellos el cliente
        hace el `PUT` del archivo a S3.
      properties:
        documentId: { type: string }
        bucket: { type: string }
        key: { type: string }
        documentType:
          type: [string, "null"]
          description: >
            TYPE_ID declarados, normalizados sin los sufijos `:N`/`:all` y
            separados por coma cuando fueron varios; `null` si no se declaró
            ninguno.
        documentTypeCounts:
          type: object
          additionalProperties:
            oneOf:
              - type: integer
                minimum: 1
              - type: string
                enum: [all]
          example: { PEDIMENTO_ERP: 1, FACTURA_FLETE_EXTRANJERO: all }
          description: >
            Decisiones explícitas materializadas por el POST: sufijos
            `TIPO:N`/`TIPO:all`, o todos los tipos sin sufijo cuando se envió
            `occurrenceMode`. Los defaults de catálogo/global se resuelven en
            enrichment y no aparecen aquí.
        occurrenceMode:
          type: [string, "null"]
          enum: [single, multiple, null]
          description: >
            Modo explícito del POST; `null` cuando la cardinalidad se resolverá
            con catálogo y default global.
        classificationMode:
          type: string
          enum: [manual, auto, guided]
          description: >
            `manual` = un tipo declarado, honrado sin re-clasificar;
            `guided` = varios declarados, se segmenta y clasifica sólo entre ellos;
            `auto` = ninguno, clasificación contra todo el catálogo.
        uploadedAt: { type: string, format: date-time }
        registeredAt: { type: string, format: date-time }
        processingStatus:
          type: string
          enum: [AWAITING_UPLOAD]
        statusUrl:
          type: string
          description: Ruta relativa para consultar el trabajo.
        retryAfterSeconds:
          type: integer
          minimum: 1
        uploadUrl: { type: string, format: uri }
        uploadMethod: { type: string, enum: [PUT] }
        uploadExpiresInSeconds: { type: integer }
        uploadExpiresAt:
          type: string
          format: date-time
          description: Momento exacto en que la URL deja de servir.
    Tracking:
      type: object
      description: >
        Resumen de procedencia/procesamiento, presente en todo resultado
        (flujo estándar y expediente por igual). `createdAt` siempre está;
        `modelIds`/`appOrigin`/`modelFallbacks` solo si hay algo que reportar.
      properties:
        createdAt: { type: string, format: date-time }
        modelIds:
          type: object
          description: Modelo que realmente corrió por fase (extractor/recovery/...).
          additionalProperties: { type: string }
        appOrigin:
          type: string
          description: App que subió el documento (x-api-key registrada con `pnpm apps:register`).
        modelFallbacks:
          type: object
          description: Solo las fases donde hubo cambio automático de modelo.
          additionalProperties:
            type: object
            properties:
              expectedModel: { type: string }
              actualModel: { type: string }
              retries: { type: integer }
              attempts:
                type: array
                items:
                  type: object
                  properties:
                    model: { type: string }
                    error: { type: string }
    DocumentResult:
      type: object
      required: [documentId, processingStatus]
      properties:
        documentId: { type: string }
        reprocessedFrom:
          type: string
          description: Presente en un trabajo creado por reprocess; id completo de su fuente.
        processingStatus:
          type: string
          enum: [AWAITING_UPLOAD, QUEUED, PROCESSING, FINISHED, FAILED]
          description: >
            Ciclo técnico público y estable. Es independiente de
            `result.validation.status`, que expresa el resultado de negocio.
        workflowStatus:
          type: string
          description: Estado interno heredado del blueprint; no usar para controlar el polling.
        documentType:
          type: string
          description: Tipo solicitado/resuelto para el documento.
        documentTypeName:
          type: string
          description: Nombre legible del tipo, cuando está disponible.
        retryAfterSeconds:
          type: integer
          minimum: 1
          description: Presente en respuestas 202; espera mínima sugerida.
        registeredAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        uploadExpiresAt: { type: string, format: date-time }
        result:
          type: [object, "null"]
          description: >
            Envelope completo. Los datos extraídos viven en `documents[]`, un
            elemento por documento encontrado en el archivo — siempre un
            arreglo, con uno o con varios. Los campos de cada documento
            dependen del catálogo de su tipo. Ver API_USO.md §2
            para un ejemplo anotado completo.
          properties:
            documentId: { type: string }
            envelopeVersion:
              type: integer
              description: >
                `2` = envelope plano (`documents[]` en la raíz). Ausente = un
                resultado guardado con la forma anterior, que el API devuelve tal
                cual se guardó: `extractedEntities` en la raíz (el árbol del
                PRIMER documento solamente) y `expediente.documents[]`. Checa
                este campo antes de asumir `documents[]` en documentos
                históricos.
            documentClassification:
              type: string
              example: PEDIMENTO_ERP,FACTURA_FLETE_EXTRANJERO
              description: >
                Qué trae el archivo. Cuando TODOS los documentos son del mismo
                tipo, ese es el tipo (aunque sean varios). Cuando son de tipos
                distintos, son esos tipos **separados por coma**, en orden de
                aparición. Los `OTRO` nunca entran (igual que en `documentCount`).


                No confundir con la columna indexada `documentType`, que en un
                archivo mixto sigue siendo `EXPEDIENTE_ADUANAL_MULTIDOCUMENTO`:
                es la partition key de un GSI y sólo admite un valor exacto.
                Buscar por los tipos de adentro (`?docType=PEDIMENTO_ERP`)
                funciona igual, vía `ContainedDocumentTypes`.
            documentMatchesType:
              type: [boolean, "null"]
              description: >
                ¿El archivo ES el documento que se declaró? `false` cuando el
                contenido es de otra naturaleza (una constancia fiscal subida
                como estado de cuenta): el documento sale `RECHAZADO`, su
                `confidence` se cae a ≤ 0.05 y `rejectionConfidence` /
                `detectedDocument` dicen qué tan seguro y qué parece ser. `true`
                cuando corresponde (una variante extranjera o de otro formato
                del MISMO documento sigue siendo `true`). `null` = no se evaluó
                (XML, tabular, flujo estándar, verificación apagada). En un
                archivo con varios documentos es `false` si ALGUNO no
                corresponde; el detalle por documento va en
                `documents[].typeCheck`. Siempre presente.
            rejectionConfidence:
              type: number
              minimum: 0
              maximum: 1
              description: >
                Qué tan seguro está el sistema de que el archivo NO es lo que se
                declaró. `0.0` cuando corresponde o no se evaluó; con varios
                documentos, la máxima entre los que no corresponden.
            detectedDocument:
              type: [string, "null"]
              example: Constancia de situación fiscal del SAT
              description: >
                Qué es en realidad el archivo según el modelo, en palabras
                (máximo ~15). `null` cuando corresponde o no se evaluó.
            aiExecuted:
              type: boolean
              description: >
                `true` si al menos un modelo de IA se ejecutó realmente en
                alguna etapa. Se determina por los modelos registrados y el
                usage real; Textract OCR no cuenta como IA generativa.
            aiUsage:
              type: object
              required: [executed, stages, inputTokens, outputTokens, images, tokenReportedStages]
              properties:
                executed: { type: boolean }
                stages: { type: array, items: { type: string } }
                inputTokens: { type: integer, minimum: 0 }
                outputTokens: { type: integer, minimum: 0 }
                images: { type: integer, minimum: 0 }
                tokenReportedStages:
                  type: array
                  items: { type: string }
                  description: Etapas cuyos tokens/imágenes sí llegaron al envelope.
            deterministicSavings:
              type: object
              description: >
                Contrafactual ESTIMADO del ahorro por extraer campos mediante
                código y enviar al modelo sólo el schema faltante. No forma
                parte del usage facturado.
              properties:
                estimated: { type: boolean, const: true }
                method: { type: string, enum: [partial_schema_counterfactual_v1] }
                documentsMeasured: { type: integer, minimum: 1 }
                billedInputTokens: { type: integer, minimum: 0 }
                billedOutputTokens: { type: integer, minimum: 0 }
                estimatedInputTokensSaved: { type: integer, minimum: 0 }
                estimatedOutputTokensSaved: { type: integer, minimum: 0 }
                estimatedInputTokensWithoutDeterministic: { type: integer, minimum: 0 }
                estimatedOutputTokensWithoutDeterministic: { type: integer, minimum: 0 }
                estimatedInputSavingPct: { type: number, minimum: 0, maximum: 100 }
                estimatedOutputSavingPct: { type: number, minimum: 0, maximum: 100 }
            documentCount:
              type: integer
              description: >
                Documentos principales encontrados; excluye `OTRO` y los
                marcadores de tipos solicitados no encontrados.
            tracking: { $ref: "#/components/schemas/Tracking" }
            validation:
              type: object
              properties:
                status: { type: string, enum: [APROBADO, RECHAZADO, REQUIERE_REVISION] }
                reviewRequired: { type: boolean }
                summary: { type: string }
                counts:
                  type: object
                  description: Cuántos documentos quedaron en cada status.
                  additionalProperties: { type: integer }
            documents:
              type: array
              description: >
                Un elemento por documento encontrado en el archivo — SIEMPRE un
                arreglo, con uno o con veinte. Es el único lugar donde viven los
                datos extraídos.
              items: { $ref: "#/components/schemas/ExtractedDocument" }
            checks:
              type: array
              description: >
                Verificaciones de nivel documento (entre documentos en el pipeline
                de expedientes). Las de POR CAMPO están en
                `documents[i].fields[*].valid`/`reason`.
              items: { type: object, additionalProperties: true }
            warnings: { type: array, items: { type: string } }
            sourceFile: { type: string }
            sourceFormat: { type: string }
            pages: { type: object, additionalProperties: true }
            usage: { type: object, additionalProperties: true }
            omitted:
              type: object
              description: >
                Presente solo si el envelope no cabía en el presupuesto de bytes:
                lista qué arreglos se cambiaron por su conteo. El contenido
                completo sigue en S3 (`?full=1`).
              additionalProperties: true
            resultLocation:
              type: object
              properties:
                bucket: { type: string }
                key: { type: string }
        fullResult:
          type: object
          description: Solo con `?full=1` — detalle por-campo (fields[]) desde S3.
          additionalProperties: true
    ExtractedDocument:
      type: object
      description: >
        Un documento encontrado dentro del archivo, o un marcador de tipo
        solicitado no encontrado (`pageStart/pageEnd: null`, REVIEW_REQUIRED).
      properties:
        index: { type: integer, description: "Posición dentro de documents[], base 1." }
        documentType: { type: string }
        documentSubtype: { type: [string, "null"] }
        businessDestination: { type: string }
        pageStart:
          type: [integer, "null"]
          description: Primera página de la sección; null si el tipo solicitado no se encontró.
        pageEnd:
          type: [integer, "null"]
          description: Última página de la sección; null si el tipo solicitado no se encontró.
        status:
          type: string
          enum: [APPROVED, PARTIALLY_APPROVED, REVIEW_REQUIRED, REJECTED, PROCESSING_ERROR]
        confidence: { type: [number, "null"] }
        fieldConfidence:
          type: number
          description: >
            Resumen compatible: confianza más repetida entre los campos con
            valor, presente cuando al menos tres comparten el mismo número.
            No se hereda: cada escalar dentro de `fields` conserva siempre su
            propia `confidence`.
        error: { type: string, description: "Presente solo si falló ESTE documento." }
        errorType: { type: string }
        liquidacionNormalizada: { type: object, additionalProperties: true }
        typeCheck:
          type: object
          description: >
            Veredicto por documento de la verificación de tipo (presente solo
            cuando se evaluó). La raíz del envelope (`documentMatchesType`,
            `rejectionConfidence`, `detectedDocument`) es el agregado del
            archivo; aquí se ve CUÁL documento no era lo que se declaró.
          properties:
            matches: { type: boolean }
            rejectionConfidence: { type: number, minimum: 0, maximum: 1 }
            detected: { type: [string, "null"] }
            reason:
              type: string
              enum: [DOCUMENTO_NO_CORRESPONDE, SEÑAL_CONTRADICHA_POR_CAMPOS]
              description: >
                Solo cuando `matches` es falso. `SEÑAL_CONTRADICHA_POR_CAMPOS` =
                el modelo dijo que no corresponde pero TODOS los campos
                obligatorios sí se leyeron: el documento va a revisión en vez de
                rechazarse.
        deterministicExtraction:
          type: object
          description: >
            Presente cuando el tipo usa `deterministic_extraction`: estrategia
            efectiva, si ESTE documento llamó IA, ramas enviadas al fallback y
            estimación auditable de tokens evitados.
          properties:
            strategy:
              type: string
              enum: [deterministic, hybrid, model]
              description: Lo que realmente ocurrió en este documento.
            aiExecuted:
              type: boolean
              description: Si la extracción de campos de este documento ejecutó IA.
            resolvedFieldCount: { type: integer, minimum: 0 }
            fallbackFields: { type: array, items: { type: string } }
            tokenSavings: { type: object, additionalProperties: true }
        extractionMode:
          type: object
          description: >
            Decisión de extracción: `requested` es lo que pidió el cliente y
            `effective` la política que el tipo pudo aplicar. `catalog` nunca
            aparece como efectivo porque en ese punto ya resolvió a model,
            hybrid o deterministic.
          properties:
            requested:
              type: string
              enum: [catalog, model, hybrid, deterministic]
              description: Lo pedido por el cliente después de aplicar la política del ambiente.
            effective:
              type: string
              enum: [model, hybrid, deterministic]
              description: La política que el tipo pudo aplicar después de resolver `catalog` y comprobar si existe mapper.
            reason:
              type: string
              enum: [type_has_no_deterministic_mapping]
              description: Presente cuando se protegió la salida usando `model` porque el tipo no tiene mapper.
        authenticity:
          $ref: "#/components/schemas/AuthenticitySummary"
        fields:
          type: object
          description: >
            Los campos del documento. Escalar -> `{value, confidence, valid}`
            (+ `reason` solo si `valid` es falso, + `source` solo si NO es
            MODEL_EXTRACTION). Objeto -> `{fields: {...}}`. Arreglo de objetos ->
            `{items: [{fields: {...}}]}`; arreglo escalar ->
            `{items: [{value, confidence, valid}]}`. **Un campo se omite solo cuando el
            documento no lo traía Y no era obligatorio**: todo lo demás viaja con
            su `confidence`; si no hubo medición, vale `0.0`.
          additionalProperties: true
    AuthenticitySummary:
      type: object
      description: >
        Presente solo en tipos de documento que verifican AUTENTICIDAD FÍSICA
        (p. ej. `CARTA_NOM35`): si el archivo es la captura de una hoja impresa,
        firmada con tinta, sellada y escaneada, o una composición digital con la
        firma/sello insertados como imagen. Es el RESUMEN: qué se concluyó y por
        qué. Los valores que deciden el estatus viajan como campos normales en
        `fields` (`CAPTURA_FISICA`, `FIRMA_PRESENTE`, `SELLO_COINCIDE_REFERENCIA`…),
        y el detalle completo (cajas, estadísticas, hashes) en `fullResult`.
        `verdict` describe el HALLAZGO, no el estatus del documento: un tipo en
        modo observación reporta `NO_AUTENTICO` en un documento que solo va a
        `REQUIERE_REVISION`.
      properties:
        verdict:
          type: string
          enum: [AUTENTICO, SOSPECHOSO, NO_AUTENTICO, NO_EVALUADO]
          description: >
            AUTENTICO: sin hallazgos. SOSPECHOSO: solo señales de juicio
            (visión, parecido, elemento ausente). NO_AUTENTICO: evidencia
            determinista (PDF digital con imagen insertada; la misma firma/sello
            en la carta de otra persona). NO_EVALUADO: alguna capa no pudo correr
            — el documento va a revisión, nunca se aprueba sin revisar.
        layers:
          type: object
          description: Estado de cada capa.
          properties:
            structure: { $ref: "#/components/schemas/AuthenticityLayerStatus" }
            pixels: { $ref: "#/components/schemas/AuthenticityLayerStatus" }
            vision: { $ref: "#/components/schemas/AuthenticityLayerStatus" }
            memory: { $ref: "#/components/schemas/AuthenticityLayerStatus" }
        reasons:
          type: array
          description: Hallazgos, en el orden en que se encontraron. Vacío si no hubo.
          items:
            type: object
            properties:
              code:
                type: string
                description: >
                  Identificador estable para ramificar, p. ej.
                  `TEXTO_NATIVO_CON_IMAGEN_PEGADA`, `FIRMA_ES_IMAGEN_INSERTADA`,
                  `SELLO_AUSENTE`, `FIRMA_REUTILIZADO_EN_OTRA_CARTA`,
                  `SIN_REFERENCIAS_REGISTRADAS`, `CARTA_YA_RECIBIDA`.
              hard:
                type: boolean
                description: true = evidencia determinista; false = juicio o aviso.
              message: { type: string, description: "Explicación legible, en español." }
        referencesFound:
          type: boolean
          description: >
            Si el emisor (`metadata.proveedor` de la carga) tenía firmas/sellos/logos
            registrados contra los cuales comparar. `false` NO rechaza: sin
            referencias se verifica presencia y no-inserción.
    AuthenticityLayerStatus:
      type: string
      enum: [OK, FALLA, NO_APLICA, ERROR, DESACTIVADA]
      description: >
        OK corrió sin hallazgos duros · FALLA encontró evidencia · NO_APLICA no
        aplica a este archivo (una foto no tiene estructura PDF) · ERROR no pudo
        correr · DESACTIVADA apagada en el catálogo o globalmente.
    FileDownloadResponse:
      type: object
      properties:
        documentId: { type: string }
        fileName: { type: string }
        fileSizeBytes: { type: integer }
        location: { type: string, enum: [processed, failed] }
        downloadUrl: { type: string, format: uri }
        downloadMethod: { type: string, enum: [GET] }
        expiresInSeconds: { type: integer }
        expiresAt: { type: string, format: date-time }
    DocumentSearchResponse:
      type: object
      properties:
        docTypes: { type: array, items: { type: string } }
        resolvedTypes:
          type: array
          items:
            type: object
            properties:
              typeId: { type: string }
              input: { type: string }
              resolvedBy: { type: string }
        expandedContainers: { type: boolean }
        field:
          type: string
          description: >
            El `field` del PRIMER filtro; igual que cuando solo podía haber
            uno. Con varios, léelos en `filters`.
        value: { type: string, description: El `value` del primer filtro. }
        op: { type: string, description: El `op` del primer filtro. }
        filters:
          type: array
          description: Todos los filtros por campo, en el orden en que se mandaron.
          items:
            type: object
            properties:
              field: { type: string }
              value: { type: string }
              op: { type: string, enum: [eq, contains] }
        system:
          type: array
          items: { type: string }
          description: Los sistemas pedidos (OR entre ellos). Solo si se mandó `system`.
        metaFilters:
          type: array
          description: >
            Los filtros `meta.<clave>` aplicados, con la clave ya en
            minúsculas. AND entre claves, OR entre los valores de una misma
            clave. Solo si se mandó alguno.
          items:
            type: object
            properties:
              key: { type: string }
              values: { type: array, items: { type: string } }
        metaOp: { type: string, enum: [eq, contains] }
        order: { type: string }
        summary: { type: boolean }
        full: { type: boolean }
        indexed:
          type: boolean
          description: "true = Query indexada; false = Scan de la tabla."
        lookup:
          type: string
          enum: [uniqueKey, typeIndex, scan]
          description: >-
            Qué camino de acceso contestó. `uniqueKey`: una sola Query sobre
            `TIPODOC#<valor normalizado>` en la tabla de lookup, porque el
            tipo declara ese campo como `unique_key` en el catálogo (requiere
            docType y op=eq; costo independiente del número de documentos del
            tipo). `typeIndex`: Query al GSI DocumentTypeIndex + filtro por
            campo dentro de la Lambda. `scan`: sin docType, Scan de la tabla.
            Un valor aún no indexado cae a `typeIndex`/`scan` y se encuentra
            igual — el camino rápido nunca produce un falso negativo.
        restrictedToApp:
          type: string
          description: Solo si la app que llama tiene AccessScope=own.
        restrictedToDocTypes:
          type: array
          items: { type: string }
          description: Solo si la app tiene AllowedDocTypes configurado.
        count: { type: integer }
        scanned: { type: integer, description: Cuántos documentos se revisaron. }
        matches:
          type: array
          items:
            type: object
            description: >
              Envelope completo por match (o resumen ligero si `summary=1`).
              Con `summary=1` incluye además `appOrigin` y `metadata`, para no
              tener que volver a pedir el documento solo para ver por qué
              entró. Cuando hubo filtros por campo trae `matched[]` — un
              `{field, matchedValue, matchedAt}` por filtro — y
              `matchedValue`/`matchedAt` sueltos, que son los del primero.
            additionalProperties: true
    DocumentTypeEntry:
      type: object
      required: [type, displayName, description]
      properties:
        type:
          type: string
          description: TYPE_ID — el mismo valor que `documentType`/`docType` en el resto del API.
          example: PEDIMENTO_ERP
        displayName: { type: string, example: "Pedimento (mapeo ERP)" }
        description:
          type: [string, "null"]
          description: Descripción libre de qué documento es y cómo se distingue de otros.
        schema:
          type: object
          description: >
            Presente SOLO con `includeSchema=1`. El árbol de campos field-centric
            del catálogo tal cual (JSON activo → `fields`): una clave
            por campo, con su `type` (`string`/`number`/`boolean`/`date`/`object`/`array`),
            si es `required`, y `hint` (dónde vive el dato en el documento, en
            español) — `object`/`array` anidan `fields`/`item_fields` con la
            misma forma. Es la fuente cruda del catálogo, no una traducción:
            spec completa del DSL en `catalogs/README.md` (interno al repo).
          additionalProperties: true
    DocumentTypesPage:
      type: object
      required: [page, pageSize, total, totalPages, types]
      properties:
        page: { type: integer, description: Página devuelta (1-indexada). }
        pageSize: { type: integer, description: "Fijo en 5 — no configurable por el caller." }
        total: { type: integer, description: Total de tipos en el catálogo (o dentro de AllowedDocTypes de la app). }
        totalPages: { type: integer }
        types:
          type: array
          items: { $ref: "#/components/schemas/DocumentTypeEntry" }
    ReferenceReserveRequest:
      type: object
      required: [kind, label]
      properties:
        kind:
          type: string
          description: Elemento que se registra (`FIRMA`, `SELLO`, `LOGO`).
          example: FIRMA
        label:
          type: string
          description: >
            Quién firma o qué sucursal/planta es el sello. De aquí sale el
            `refId`.
          example: Lic. Julio Lemus
        fileName:
          type: string
          description: Opcional — nombre del archivo de origen; solo se anota como procedencia.
    ReferenceReservation:
      type: object
      required: [scope, key, kind, refId, label, status, uploadUrl, uploadMethod, uploadExpiresInSeconds, uploadExpiresAt, confirmUrl]
      properties:
        scope: { type: string, example: PROVEEDOR }
        key: { type: string, example: "10040" }
        kind: { type: string, example: FIRMA }
        refId: { type: string, example: lic-julio-lemus }
        label: { type: string, example: Lic. Julio Lemus }
        status: { type: string, enum: [PENDING] }
        uploadUrl:
          type: string
          description: >
            URL prefirmada de S3 para subir el recorte con `PUT`. Sin
            `x-api-key` y sin cabeceras extra.
        uploadMethod: { type: string, enum: [PUT] }
        uploadExpiresInSeconds: { type: integer, example: 900 }
        uploadExpiresAt: { type: string, format: date-time }
        confirmUrl:
          type: string
          description: Ruta relativa del paso 3 (se concatena a la base del API).
          example: /references/PROVEEDOR/10040/FIRMA/lic-julio-lemus/confirm
    ReferenceConfirmRequest:
      type: object
      properties:
        force:
          type: boolean
          default: false
          description: >
            `true` registra la referencia aunque su tinta coincida con la de
            otra ya registrada (`SIMILAR_REFERENCE`).
    Reference:
      type: object
      description: >
        Ficha de una referencia: solo metadatos. Nunca incluye la huella de
        tinta ni el embedding. Los campos sin valor se omiten (una reserva
        pendiente no trae `format`, `width`, `height` ni `sha256`).
      required: [scope, key, kind, refId, label, status, hasInkFingerprint, indexed]
      properties:
        scope: { type: string, example: PROVEEDOR }
        key: { type: string, example: "10040" }
        kind: { type: string, example: FIRMA }
        refId: { type: string, example: lic-julio-lemus }
        label: { type: string, example: Lic. Julio Lemus }
        status:
          type: string
          enum: [ACTIVE, INACTIVE, PENDING]
          description: >
            `PENDING` reservada, esperando imagen y confirmación; `ACTIVE` en
            uso; `INACTIVE` dada de baja.
        format: { type: string, enum: [png, jpeg], description: "Formato real, leído de los bytes." }
        width: { type: integer, description: Ancho en px. }
        height: { type: integer, description: Alto en px. }
        sha256: { type: string, description: SHA-256 del archivo registrado. }
        hasInkFingerprint:
          type: boolean
          description: "`false` en elementos que no usan huella de tinta (p. ej. un logo)."
        indexed:
          type: boolean
          description: >
            `true` si ya está en el índice de búsqueda por similitud. `false`
            no impide la comparación directa; volver a confirmar lo reintenta.
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, description: Nombre de la app (u operador) que la registró. }
        activatedAt: { type: string, format: date-time }
        deactivatedAt: { type: string, format: date-time }
        deactivatedBy: { type: string }
    ReferenceIssue:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >
            En `errors`: NOT_AN_IMAGE, TOO_LARGE_BYTES, TOO_SMALL,
            TOO_LARGE_DIMENSIONS, NO_INK. En `warnings`: TOO_MUCH_INK.
        message: { type: string }
    ReferenceConfirmed:
      allOf:
        - $ref: "#/components/schemas/Reference"
        - type: object
          required: [warnings]
          properties:
            warnings:
              type: array
              description: Avisos de la revisión que no impidieron el alta.
              items: { $ref: "#/components/schemas/ReferenceIssue" }
    ReferenceDetail:
      allOf:
        - $ref: "#/components/schemas/Reference"
        - type: object
          properties:
            imageUrl:
              type: string
              description: Solo en referencias activas. URL prefirmada de S3 para ver la imagen.
            imageUrlExpiresInSeconds: { type: integer, example: 300 }
    ReferenceList:
      type: object
      required: [scope, key, count, references]
      properties:
        scope: { type: string }
        key: { type: string }
        count: { type: integer }
        references:
          type: array
          items: { $ref: "#/components/schemas/Reference" }
    ReferenceInputError:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            suggested:
              type: string
              description: Solo en `INVALID_REFERENCE_KEY` — la clave ya normalizada, que sí se aceptaría.
            valid:
              type: array
              items: { type: string }
              description: Solo en `INVALID_SCOPE` / `INVALID_KIND` — los valores aceptados.
    ReferenceConflict:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            existing:
              type: object
              description: Solo en `DUPLICATE_REFERENCE` / `SIMILAR_REFERENCE` — la referencia con la que choca.
              required: [kind, refId]
              properties:
                kind: { type: string }
                refId: { type: string }
    ReferenceRejected:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          required: [errors, warnings]
          properties:
            errors:
              type: array
              items: { $ref: "#/components/schemas/ReferenceIssue" }
            warnings:
              type: array
              items: { $ref: "#/components/schemas/ReferenceIssue" }
